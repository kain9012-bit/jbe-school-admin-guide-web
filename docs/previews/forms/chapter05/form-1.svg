<text x="64.61" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[서식1]</text>
<text x="213.07" y="147.79" font-size="20" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="169.13" lengthAdjust="spacing" font-weight="bold" text-decoration="underline">일상감사 의뢰서</text>
<text x="56.69" y="173.84" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="61.1" lengthAdjust="spacing"> 주관부서:</text>
<text x="338.79" y="173.84" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="65.57" lengthAdjust="spacing">최종결재자</text>
<text x="404.36" y="173.84" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif">:</text>
<text x="56.69" y="194.64" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.11" lengthAdjust="spacing"> 건</text>
<text x="101.8" y="194.64" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.77" lengthAdjust="spacing">명:</text>
<text x="339.57" y="194.64" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif">담</text>
<text x="365.18" y="194.64" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif">당</text>
<text x="390.92" y="194.64" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif">자</text>
<text x="403.66" y="194.64" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif">:</text>
<text x="339.57" y="215.44" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="62.95" lengthAdjust="spacing">의 뢰 일 자</text>
<text x="402.52" y="215.44" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif">:</text>
<text x="59.5" y="257.57" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="74.75" lengthAdjust="spacing" font-weight="bold"> 1. 업무내용</text>
<text x="72" y="278.37" font-size="12" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="93.48" lengthAdjust="spacing">○ 사업의 필요성</text>
<text x="71.5" y="317.52" font-size="12" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="64.2" lengthAdjust="spacing">○ 사업개요</text>
<text x="71.5" y="336.72" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="112.2" lengthAdjust="spacing"> ※ 사업명, 대상, 내역</text>
<text x="71.5" y="375.97" font-size="12" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="206.28" lengthAdjust="spacing">○ 예산현황 및 사업기간(집행시기) 등</text>
<text x="76" y="395.07" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="336.49" lengthAdjust="spacing">※예산내역, 설계금액(추정금액), 예산과목, 사업추진 일정 등을 기재</text>
<text x="59.5" y="449.57" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="163.41" lengthAdjust="spacing" font-weight="bold"> 2. 일상감사 검토 의뢰사항</text>
<text x="77" y="470.37" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="180.18" lengthAdjust="spacing">※ 감사 시 중점 검토사항 등을 기재</text>
<text x="59.5" y="511.97" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="157.3" lengthAdjust="spacing" font-weight="bold"> 3. 계약방법 및 관련 규정</text>
<text x="77" y="532.77" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="231.88" lengthAdjust="spacing">※ 계약방법, 사업 근거 및 관련법령 등을 명시</text>
<text x="59.5" y="574.37" font-size="13" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="74.75" lengthAdjust="spacing" font-weight="bold"> 4. 관련서류</text>
<text x="76" y="628.67" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="137.17" lengthAdjust="spacing">※ 사업 추진관련 자료 첨부</text>
<text x="82.01" y="646.27" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="186.47" lengthAdjust="spacing">○ (공통) 사업계획서, 관련 지침 및 </text>
<text x="268.48" y="646.27" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="258.07" lengthAdjust="spacing">예산배정 공문(또는 예산서 등 예산 확보 여부 확인자료)</text>
<text x="526.55" y="646.27" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="9.23" lengthAdjust="spacing">, </text>
<text x="59.5" y="663.87" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="123.2" lengthAdjust="spacing" font-weight="bold">기타 감사에 필요한 서류</text>
<text x="93.16" y="681.47" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="442.62" lengthAdjust="spacing">- 시설공사: 설계내역서, 공사시방서, 수량산출서, 일위대가표, 설계도면, 시설공사 지역</text>
<text x="59.5" y="699.07" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="268.07" lengthAdjust="spacing">교육지원청 사전 설계도서 검토 관련 공문 및 내용 등</text>
<text x="92.5" y="716.67" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="90.64" lengthAdjust="spacing">- 물품제조․구매: </text>
<text x="183.14" y="716.67" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="333.51" lengthAdjust="spacing">물품제조 원가계산서, 물품구매 산출기초초사서, 규격서 및 설명서(사양서) 등</text>
<text x="92.5" y="734.27" font-size="11" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="302.06" lengthAdjust="spacing">- 용역: 설계내역서(원가계산, 과업내용서 등), 제안요청서 등</text>
