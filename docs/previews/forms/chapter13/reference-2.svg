<text x="70.18" y="204.08" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="249.28" lengthAdjust="spacing" font-weight="bold"> 정수기 사용과정에서의 위생관리 </text>
<rect x="50.01" y="185.74" width="19.7" height="18.34" fill="#808080"/>
<rect x="48.66" y="183.71" width="19.7" height="18.34" fill="#FFFFFF" stroke="#000000" stroke-width="0.96"/>
<text x="56.69" y="237.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="226.65" lengthAdjust="spacing">  정수기 설치에 부적합한 장소</text>
<text x="79.19" y="264.03" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="336.6" lengthAdjust="spacing">※ 총대장균군 및 탁도 등 수질오염물질에 노출되지 않아야 함</text>
<text x="71.69" y="296.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="249.45" lengthAdjust="spacing">- 실외 또는 직사광선이 비추는 장소</text>
<text x="71.69" y="328.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="161.7" lengthAdjust="spacing">- 화장실과 가까운 장소</text>
<text x="71.69" y="360.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="100.8" lengthAdjust="spacing">- 냉·난방기 앞</text>
<text x="56.69" y="392.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="74" lengthAdjust="spacing">  정수기</text>
<text x="136.83" y="392.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="58.83" lengthAdjust="spacing">토출구를</text>
<text x="201.8" y="392.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="58.83" lengthAdjust="spacing">사용자가</text>
<text x="266.77" y="392.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="29.42" lengthAdjust="spacing">직접</text>
<text x="302.33" y="392.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="236.24" lengthAdjust="spacing">만지거나 접촉금지 등 주의사항을 </text>
<text x="56.69" y="419.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="189.6" lengthAdjust="spacing">정수기 외부표면에 상시부착</text>
<text x="56.69" y="451.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="461.55" lengthAdjust="spacing">  교환 가능한 취수레버와 에어필터는 연 1회 이상 정기적인 교환</text>
<text x="56.69" y="483.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="319.2" lengthAdjust="spacing">  정수기 내·외부 정기적인 청소와 소독 실시</text>
<text x="71.91" y="515.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="15.98" lengthAdjust="spacing">- </text>
<text x="87.88" y="515.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="443.08" lengthAdjust="spacing">필터는 해당 정수기의 사용방법 설명서에 따라 정기적으로 교환하고,</text>
<text x="56.69" y="542.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="441.54" lengthAdjust="spacing">최소 6개월마다 1회 이상 물과 접촉하는 부분에 대해 청소</text>
<text x="498.23" y="542.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="40.34" lengthAdjust="spacing">소독 </text>
<text x="56.69" y="569.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="398.37" lengthAdjust="spacing">실시(이 경우 소독에 의한 약품이 정수기에 잔류하지 않도록</text>
<text x="455.06" y="569.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="40.99" lengthAdjust="spacing"> 조치)</text>
<text x="56.69" y="601.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="160.95" lengthAdjust="spacing">  수조의 위생적 관리</text>
<text x="72.39" y="633.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="466.18" lengthAdjust="spacing">- 월 1회 이상 세척밸브를 열어 저장탱크의 물을 배수하고, 수조 </text>
<text x="56.69" y="660.03" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="299.4" lengthAdjust="spacing">내부를 부드러운 천으로 닦아 항시 청결유지</text>
</g></g>
</svg>