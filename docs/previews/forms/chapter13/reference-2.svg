<text x="151.53" y="146.14" font-size="20" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="292.2" lengthAdjust="spacing" font-weight="bold">학교 내 정수기의 위생관리 방안</text>
