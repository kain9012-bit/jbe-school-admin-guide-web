<text x="56.69" y="348.11" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">3. 빠른 시일 내에 하자가 보수되어 급식 운영이 정상적으로 이루어질 수 있도록 적극 </text>
