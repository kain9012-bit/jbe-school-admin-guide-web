<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 1707.76" width="595.28pt" height="1707.76pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.88"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[예시2]</text>
<text x="184.75" y="134.79" font-size="16" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="225.76" lengthAdjust="spacing" font-weight="bold">승강기 유지관리 계약 특수조건</text>
<text x="68.38" y="175.77" font-size="11.5" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="189.23" lengthAdjust="spacing">○○학교장(이하 “갑”이라 칭한다)과 </text>
<text x="337.03" y="175.77" font-size="11.5" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="156.22" lengthAdjust="spacing">(이하 “을”이라 칭한다)는 갑의</text>
<text x="498.98" y="175.77" font-size="11.5" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="33.68" lengthAdjust="spacing">승강기</text>
<text x="56.69" y="194.15" font-size="11.5" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="391.04" lengthAdjust="spacing">시설에 대한 유지관리 업무를 을에게 대행하게 함에 있어 아래 사항을 계약의</text>
<text x="447.73" y="194.15" font-size="11.5" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="78.83" lengthAdjust="spacing"> 일부로 정한다.</text>
<text x="56.69" y="228.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="114.62" lengthAdjust="spacing">제1조(유지관리의 범위)</text>
<text x="182.31" y="228.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="342.09" lengthAdjust="spacing">본 계약상의 “을”의 유지관리의 범위는 다음 각 조의 기술된 바에 따른다.</text>
<text x="56.69" y="255.02" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">제2조(정기점검 및 고장수리) ① “을”은 “갑”의 승강기를 월 1회 이상 정기적으로 점검(승강기 </text>
<text x="56.69" y="272.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">시설 안전관리법 시행령 제14조의2의 규정에 따른 검사항목 및 방법 등은 필수사항임), 보수</text>
<text x="56.69" y="290.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="376.64" lengthAdjust="spacing">하되 각 기기를 청소하고 급유하며 안전장치의 기능검사, 조정 등을 행한다.</text>
<text x="68.24" y="307.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="470.33" lengthAdjust="spacing">② 정기점검일과 시간은 “을”의 통상근무일 근무시간 중으로 하되, “을”의 업무에 지장이 </text>
<text x="56.69" y="325.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="180.29" lengthAdjust="spacing">없는 시간으로 “갑”이 정할 수 있다.</text>
<text x="67.93" y="343.02" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="470.64" lengthAdjust="spacing">③ 승강기의 갑작스런 고장 시에 “갑”은 신속히 “을”에게 그 상세한 고장내역을 통지하여야 </text>
<text x="56.69" y="360.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="476.11" lengthAdjust="spacing">하며, “을”은 연락받은 즉시 기술자를 파견하여 복구, 수리하여야 한다. 단, “갑”이 승강기에</text>
<text x="56.69" y="378.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="476.12" lengthAdjust="spacing">발생한 이상을 “을”에게 통지하지 않거나 지연통지, 사실과 다르게 통지함으로써 발생한 사고</text>
<text x="56.69" y="395.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="201.63" lengthAdjust="spacing">및 손해에 대하여는 “갑”이 책임을 진다.</text>
<text x="67.89" y="413.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.46" lengthAdjust="spacing">④ </text>
<text x="84.36" y="413.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="448.61" lengthAdjust="spacing">“을”은 승강기의 정기점검 또는 고장수리 후 그 결과를 유지관리일지에 기록하여 “갑”에게</text>
<text x="56.69" y="431.02" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">제출하여야 하며, 이상이 발견되었을 때에는 즉시 “갑”에게 사실을 통보하고 쌍방 상의하여 </text>
<text x="56.69" y="448.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="121.22" lengthAdjust="spacing">처리함을 원칙으로 한다.</text>
<text x="67.88" y="466.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.45" lengthAdjust="spacing">⑤ </text>
<text x="84.34" y="466.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="448.64" lengthAdjust="spacing">“갑”은 본 계약기간 동안 본 계약제품에 대한 고장수리, 유지관리, 교체, 정비 등의 용역을</text>
<text x="56.69" y="483.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="309.54" lengthAdjust="spacing">“을”의 사전 서면동의 없이 제3자에게 의뢰하여서는 안 된다. </text>
<text x="67.89" y="501.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="470.68" lengthAdjust="spacing">⑥ “갑”은 “을”이 본 계약상의 유지관리용역을 원만히 제공할 수 있도록 적절한 공간, 전력, </text>
<text x="56.69" y="519.02" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="212.3" lengthAdjust="spacing">환기 조명 등을 “을”에게 제공하여야 한다.</text>
<text x="68.03" y="536.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.68" lengthAdjust="spacing">⑦ </text>
<text x="84.71" y="536.62" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="453.86" lengthAdjust="spacing">“을”은 유지관리용역 제공 시 승강기의 자재가 노후하거나 기타 사고의 위험이 있어 교체</text>
<text x="56.69" y="554.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">해야 할 필요가 있다고 판단되는 경우, 이의 교체를 &quot;갑&quot;에게 요청할 수 있고, &quot;갑&quot;은 이러한 </text>
<text x="56.69" y="571.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="476.12" lengthAdjust="spacing">요청을 적극적으로 검토, 수용하여야 한다. 단, &quot;갑&quot;이 &quot;을&quot;의 이러한 교체 요청에 응하지 않아</text>
<text x="56.69" y="589.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="294.47" lengthAdjust="spacing">발생하는 사고 및 손해에 대하여는 &quot;갑&quot;이 책임지기로 한다.</text>
<text x="56.69" y="615.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="84.53" lengthAdjust="spacing">제3조(수리비용) </text>
<text x="141.22" y="615.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="391.73" lengthAdjust="spacing">승강기의 점검 보수에 있어 다음 각 호의 소모성 자재는 “을”이 무상 공급하고,</text>
<text x="56.69" y="633.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="421.08" lengthAdjust="spacing">기타 부품의 교체나 수리비용은 “을”의 견적에 의하여 “갑”이 별도 부담하기로 한다.</text>
<text x="74.2" y="653.85" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="102.84" lengthAdjust="spacing">1. CARBON BRUSH</text>
<text x="286.85" y="653.85" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="54.36" lengthAdjust="spacing">2. FUSE류</text>
<text x="74.2" y="670.5" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="123.79" lengthAdjust="spacing">3. LAMP류(HALL, CAR)</text>
<text x="286.85" y="670.5" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="47.08" lengthAdjust="spacing">4. 윤활유</text>
<text x="74.2" y="687.15" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="96.53" lengthAdjust="spacing">5. 작업등 SOCKET</text>
<text x="286.85" y="687.15" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="150.02" lengthAdjust="spacing">6. 비상등(LAMP 및 SOCKET)</text>
<text x="74.2" y="703.8" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="102.3" lengthAdjust="spacing">7. 보루(기름 제거용)</text>
<text x="286.85" y="703.8" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="146.69" lengthAdjust="spacing">8. BUTTON SWITCH 접점류</text>
<text x="56.69" y="736.92" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="79.19" lengthAdjust="spacing">제4조(책임) ① </text>
<text x="135.88" y="736.92" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="397.07" lengthAdjust="spacing">“을”의 유지관리용역 제공 상의 고의 또는 과실에 의한 승강기의 사고와 “을”의</text>
<text x="56.69" y="754.52" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="476.12" lengthAdjust="spacing">보수원이 작업 중 입는 사고, “을”의 유지관리용역 제공과 관련하여 발생한 사고, 손해에 대하여는</text>
<text x="56.69" y="772.12" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="158.62" lengthAdjust="spacing">“을”이 책임을 부담하기로 한다.</text>
</g></g>
<g data-page="2" transform="translate(0 865.88)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="68.1" y="94.38" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="470.47" lengthAdjust="spacing">② 위 제1항 이외의 천재지변, 건물 자체의 하자, 당초 제작공장의 폐업․공장 폐쇄에 따른 </text>
<text x="56.69" y="111.98" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">부속 조달 불가능으로 인하여 발생한 일체의 사고와 손해에 대하여서는 “갑”이 책임지기로 </text>
<text x="56.69" y="129.58" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.86" lengthAdjust="spacing">한다.</text>
<text x="56.69" y="157.06" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">제</text>
<text x="67.36" y="157.06" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="455.2" lengthAdjust="spacing">5조(해지) ① 다음 각 호의 사항이 발생하였을 경우, “갑”은 즉시 본 계약을 해지할 수 있다.</text>
<text x="73.46" y="174.66" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="20.01" lengthAdjust="spacing">가. </text>
<text x="93.47" y="174.66" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="445.1" lengthAdjust="spacing">“을”이 해산, 청산, 파산 또는 회사정리절차에 들어가거나 상대방 당사자가 발행한 어음이 </text>
<text x="56.69" y="192.26" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="69.52" lengthAdjust="spacing">부도나는 경우</text>
<text x="73.95" y="209.86" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="464.62" lengthAdjust="spacing">나. “을”이 본 계약상의 의무를 이행하지 아니하거나 본 계약을 위반하여 10일 간의 유예</text>
<text x="56.69" y="227.46" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="305.25" lengthAdjust="spacing">기간을 둔 시정요구를 받고서도 이를 시정하지 아니하는 경우</text>
<text x="67.69" y="245.06" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="409.2" lengthAdjust="spacing">② 다음 각 호의 사항이 발생하였을 경우, “을”은 즉시 본 계약을 해지할 수 있다.</text>
<text x="73.19" y="262.66" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="378.51" lengthAdjust="spacing">가. “갑”이 본 계약상의 월 보수료나 기타의 보수를 지급하지 아니하는 경우</text>
<text x="73.52" y="280.26" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="465.05" lengthAdjust="spacing">나. “갑”이 “을”의 사전 동의 없이 제3자에게 승강기의 고장수리, 유지관리, 교체정비 등의 </text>
<text x="56.69" y="297.86" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="96.36" lengthAdjust="spacing">용역을 의뢰한 경우</text>
<text x="68.15" y="315.46" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="470.42" lengthAdjust="spacing">③ 제6조제2항 규정에 따라 본 계약이 해지되는 경우에도 이미 발생한 본 계약당사자들의 </text>
<text x="56.69" y="333.06" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="206.91" lengthAdjust="spacing">권리의무는 아무런 영향을 받지 아니한다.</text>
<text x="56.69" y="360.54" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">제6조(보수료의 지급) “갑”이 지불할 월보수료는 매월 말 “을”의 청구에 따라 익월 14일까지 </text>
<text x="56.69" y="378.14" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">“을”의 계좌로 송금하여야 한다. 기타 본 계약과 관련하여 “갑”이 지불하여야 할 금액이 발생</text>
<text x="56.69" y="395.74" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="395.67" lengthAdjust="spacing">하였을 경우 “을”의 청구일로부터 14일 이내에 “을”의 계좌로 송금하여야 한다.</text>
<text x="56.69" y="423.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">제</text>
<text x="67.66" y="423.22" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="465.26" lengthAdjust="spacing">7조(유지관리일지) “을”은 매회 점검 시 점검결과의 이상 유무와 점검내용을 유지관리일지에</text>
<text x="56.69" y="440.82" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">기록하여 “갑”에게 제출하여야 하며, 제출내용에 따라 “을”의 유지관리용역 제공은 이행된 </text>
<text x="56.69" y="458.42" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="83.71" lengthAdjust="spacing">것으로 간주한다.</text>
<text x="56.69" y="485.9" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="95.11" lengthAdjust="spacing">제8조(계약의 해석)</text>
<text x="151.8" y="485.9" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="386.77" lengthAdjust="spacing"> 본 계약에 명시되지 않은 사항이 발생하는 경우에는 “갑”과 “을”이 상의하여 </text>
<text x="56.69" y="503.5" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="60.5" lengthAdjust="spacing">해결하며, 서</text>
<text x="117.19" y="503.5" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="249.92" lengthAdjust="spacing">로 의견이 상이할 경우에는 일반 상관례에 따른다.</text>
<text x="56.69" y="530.98" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">제</text>
<text x="67.62" y="530.98" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="465.32" lengthAdjust="spacing">9조(관할법원) 본 계약과 관련하여 발생하는 분쟁에 대한 관할 법원은 “갑”이 정하는 법원으로</text>
<text x="56.69" y="548.58" font-size="11" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.86" lengthAdjust="spacing">한다.</text>
</g></g>
</svg>