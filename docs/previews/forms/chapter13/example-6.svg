<line x1="56.69" y1="265.27" x2="552.77" y2="265.31" stroke="#000000" stroke-width="0.91"/>
<text x="56.69" y="278.51" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="238.2" lengthAdjust="spacing">1. 귀 사(조합)의 무궁한 발전을 기원합니다.</text>
<text x="56.69" y="297.71" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="17.37" lengthAdjust="spacing">2. </text>
<text x="74.06" y="297.71" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="464.51" lengthAdjust="spacing">지방자치단체를 당사자로 하는 계약에 관한 법률 시행규칙 제69조제3항에 근거하여 </text>
<text x="56.69" y="316.91" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="39.75" lengthAdjust="spacing">20○○.</text>
<text x="114.19" y="316.91" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">.</text>
<text x="135.72" y="316.91" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="402.85" lengthAdjust="spacing">. ○○건설(주) 대표 ○○○와 계약하여 시공한 “○○학교 ○○○○공사”가 </text>
<text x="56.69" y="336.11" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="209.92" lengthAdjust="spacing">아래와 같이 하자가 발생하여 알려드리니,</text>
<text x="56.69" y="355.31" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="109.32" lengthAdjust="spacing">3. 시공사는 20○○.</text>
<text x="184.01" y="355.31" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">.</text>
<text x="205.85" y="355.31" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="229.56" lengthAdjust="spacing">.까지 하자보수를 완료하여 주시기 바라며,</text>
<text x="56.69" y="374.51" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">4. ○○보증보험(주)에서는 하자보수가 조속한 시일 내에 완료될 수 있도록 적극 협조</text>
<text x="56.69" y="393.71" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="126.6" lengthAdjust="spacing">하여 주시기 바랍니다. </text>
<text x="239.07" y="412.91" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="117.12" lengthAdjust="spacing">○ 하자 발생 내역 ○</text>
<text x="84.18" y="444.61" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="32.01" lengthAdjust="spacing" font-weight="bold">공사명</text>
