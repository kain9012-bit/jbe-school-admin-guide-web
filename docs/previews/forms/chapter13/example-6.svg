<text x="59.5" y="235.95" font-size="14" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="36.12" lengthAdjust="spacing">(경유)</text>
