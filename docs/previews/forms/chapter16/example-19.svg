<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 2573.64" width="595.28pt" height="2573.64pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.88"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="88.12" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="44.16" lengthAdjust="spacing">[예시19]</text>
<rect x="116.46" y="110.29" width="402.34" height="37.11" fill="none"/>
<rect x="113.22" y="106.41" width="400.8" height="36.97" fill="none" stroke="#000000" stroke-width="0.91"/>
<text x="56.69" y="175.31" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="162.4" lengthAdjust="spacing">1. 경비 집행 시 유의사항</text>
<rect x="56.69" y="183.02" width="478.62" height="257.66" fill="#E6E6E6"/>
<text x="62.36" y="197.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="296.19" lengthAdjust="spacing"> ○ 경비는 회계관리규정에 따라 학교장 책임 하에 집행 및 정산한다.</text>
<text x="62.36" y="213.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="427.14" lengthAdjust="spacing"> ○ 현지에서 직접 집행해야 할 경비는 임시 출납원을 임명하여 집행하고, 학교법인카드를 사용한다.</text>
<text x="81.16" y="229.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="362.84" lengthAdjust="spacing">※ 품의 결재 후, 학교 법인카드를 사용하여 집행하는 경우는 임시출납원 임명 불필요</text>
<text x="62.36" y="245.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="18.52" lengthAdjust="spacing"> ○ </text>
<text x="80.88" y="245.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="420.44" lengthAdjust="spacing">대상업소가 신용카드 사용 가맹점에 가입되어 있지 않으나 부득이 그 업소를 이용해야 하는 경우는 예외</text>
<text x="62.36" y="261.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="199.6" lengthAdjust="spacing"> ○ 위탁업체와 계약시 세금계산서 징구방법</text>
<text x="82.36" y="277.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="95.5" lengthAdjust="spacing">(국세청 고객만족센터</text>
<text x="182.86" y="277.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="97.16" lengthAdjust="spacing" fill="#0000FF">http://call.nts.go.kr</text>
<text x="285.02" y="277.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="22.6" lengthAdjust="spacing">참고)</text>
<text x="72.56" y="293.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="457.08" lengthAdjust="spacing">▸위탁업체와 교통비, 숙박비, 식비, 입장료 등 소요경비와 위탁수수료를 구분하여 계약한 경우 ⇒ </text>
<text x="82.36" y="309.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="447.28" lengthAdjust="spacing">위탁수수료에 대하여만 세금계산서를 징구하고, 나머지는 위탁업체와 실제 사용업체와의 거래내역</text>
<text x="82.36" y="325.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="127.46" lengthAdjust="spacing">이 기록된 세금계산서를 확인</text>
<text x="72.36" y="341.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="297.2" lengthAdjust="spacing">▸구분 없이 계약한 경우 ⇒ 전체 금액에 대한 세금계산서를 징구</text>
<text x="62.36" y="357.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="467.28" lengthAdjust="spacing"> ○ 종료 후 10일 이내에 정산을 하도록 하고 정산일로부터 10일 이내에 사업 추진내역을 학부모에게 공개하</text>
<text x="82.36" y="373.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="198.34" lengthAdjust="spacing">여야 하며, 잔액이 있을 경우 환불하여야 한다.</text>
<text x="62.36" y="389.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.7" lengthAdjust="spacing"> ○ </text>
<text x="82.06" y="389.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="419.43" lengthAdjust="spacing">환불할 액수가 소액일 경우 학교운영위원회의 심의를 거쳐, 학생복지비 등으로 편성하여 사용 가능</text>
<text x="62.36" y="405.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.7" lengthAdjust="spacing"> ○ </text>
<text x="82.06" y="405.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="420.42" lengthAdjust="spacing">계약상대자의 청구를 받은 날부터 5일 이내에(공휴일 및 토요일 제외) 대가를 지급하도록 한다.</text>
<text x="62.36" y="421.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="287.1" lengthAdjust="spacing"> ○ 경비는 반드시 계약상대자(대표자) 명의의 계좌로 입금한다.</text>
<text x="77.36" y="437.19" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="326.8" lengthAdjust="spacing">- 중간 알선업자에게 송금하여 발생한 회계사고가 발생하지 않도록 유의</text>
<text x="56.69" y="505.27" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="314.16" lengthAdjust="spacing">2. 인솔자(교직원)의 여비 및 시간외수당 지급방법</text>
<text x="56.69" y="527.92" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="26.54" lengthAdjust="spacing"> 가. </text>
<text x="83.23" y="527.92" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="455.36" lengthAdjust="spacing">인솔자(인솔교사, 내부안전요원, 기타보조인력 중 교직원)의 여비(교통비, 숙박비, 식비, 일</text>
<text x="56.69" y="547.72" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="13.76" lengthAdjust="spacing">비)</text>
<text x="67.92" y="567.52" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.67" lengthAdjust="spacing">1) 인솔자의 여비 및 필요경비(입장료 등)는 학교운영비에서 지출하되 일비 이외의 경비는 개</text>
<text x="82.76" y="587.32" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="223.08" lengthAdjust="spacing">인에게 지급하지 않고 업체에 일괄 송금한다.</text>
<text x="67.69" y="607.12" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="450.89" lengthAdjust="spacing">2) 여비의 지급 방법, 대상 및 절차는 예산의 범위 내에서 공무원 여비규정에 따라 정한다.</text>
<text x="67.69" y="626.92" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="437.8" lengthAdjust="spacing">3) 차량을 임차하여 사용하거나, 관용차량을 이용한 출장 시에는 일비의 2분의 1만 지급</text>
<text x="56.69" y="666.52" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="159.06" lengthAdjust="spacing"> 나. 인솔자의 시간외 근무수당 </text>
<text x="68.99" y="686.32" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.85" lengthAdjust="spacing">1) </text>
<text x="85.85" y="686.32" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="452.74" lengthAdjust="spacing">현장체험학습 실시 전에 시간외 근무명령을 득한 자에 한하여 시간외 근무수당을 지급하도</text>
<text x="72.69" y="706.12" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="36.93" lengthAdjust="spacing">록 한다.</text>
<text x="67.4" y="725.92" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="14.67" lengthAdjust="spacingAndGlyphs">2) </text>
<text x="82.07" y="725.92" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="456.52" lengthAdjust="spacingAndGlyphs">야간 생활지도 근무조 편성을 하도록 하고 그 초과근무 시간만큼 시간외 근무수당을 지급하</text>
<text x="81.87" y="745.72" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="53.25" lengthAdjust="spacing">도록 한다.</text>
<text x="67.69" y="765.52" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="218.46" lengthAdjust="spacing">3) 국외출장은 초과근무수당 지급할 수 없음</text>
</g></g>
<g data-page="2" transform="translate(0 865.88)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="56.69" y="158.35" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="326.2" lengthAdjust="spacing">3. 학생 단체 교육활동시 보험 가입 관련 고려사항 </text>
<text x="56.69" y="181" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="126.72" lengthAdjust="spacing"> 가. 여행자보험 의무가입</text>
<text x="73.19" y="200.8" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="340.56" lengthAdjust="spacing">1) 활동: 1일형 현장체험학습 중 고위험활동 및 숙박형 현장체험학습</text>
<text x="73.19" y="220.6" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="362.78" lengthAdjust="spacing">2) 대상: 학생, 인솔교사, 보조인력(안전요원, 기타보조인력) 등 모두 포함</text>
<text x="56.69" y="240.4" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="142.89" lengthAdjust="spacing"> 나. 영업배상보험 가입 확인</text>
<text x="79.74" y="265" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.4" lengthAdjust="spacing" font-weight="bold">구분</text>
<text x="308.16" y="265" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.8" lengthAdjust="spacing" font-weight="bold">보험종류</text>
<text x="79.74" y="283.48" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.4" lengthAdjust="spacing">차량</text>
<text x="127.28" y="283.48" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="67.9" lengthAdjust="spacing">자동차종합보험</text>
<text x="70.04" y="309.96" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.8" lengthAdjust="spacing">수련시설</text>
<text x="127.28" y="301.96" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="400.55" lengthAdjust="spacing">수련시설배상책임보험(보상한도 8천만원 이상, 사고당 무한대), 영업배상책임보험, 화재</text>
<text x="127.28" y="317.96" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="114.9" lengthAdjust="spacing">보험, 음식물배상책임보험</text>
<text x="70.04" y="336.44" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.8" lengthAdjust="spacing">숙식시설</text>
<text x="127.28" y="336.44" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="220.1" lengthAdjust="spacing">영업배상책임보험, 화재보험, 음식물배상책임보험</text>
