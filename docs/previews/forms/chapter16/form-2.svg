<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.86" width="595.28pt" height="841.86pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.86"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="115.1" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[서식2]</text>
<text x="185.93" y="200.79" font-size="20" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="223.4" lengthAdjust="spacing">하자보수보증금 지급각서</text>
<text x="126.69" y="263.64" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="30.42" lengthAdjust="spacing">1. 공</text>
<text x="170.11" y="263.64" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">사</text>
<text x="195.72" y="263.64" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.77" lengthAdjust="spacing">명:</text>
<text x="126.69" y="287.04" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="91.91" lengthAdjust="spacing">2. 계 약 금 액:</text>
<text x="126.69" y="310.44" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="122.85" lengthAdjust="spacing">3. 하자보수보증금율:</text>
<text x="126.69" y="333.84" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="110.24" lengthAdjust="spacing">4. 하자보수보증금:</text>
<text x="126.69" y="357.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="122.85" lengthAdjust="spacing">5. 하자보수보증기간:</text>
<text x="77.02" y="401.44" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="296.85" lengthAdjust="spacing">귀교과 계약체결한 위 공사의 하자보수보증금은 </text>
<text x="373.88" y="401.44" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="164.69" lengthAdjust="spacing" font-weight="bold">“지방자치단체를 당사자로 </text>
<text x="56.69" y="424.84" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="328.23" lengthAdjust="spacing" font-weight="bold">하는 계약에 관한 법률 시행규칙 제70조 제2항 제3호”</text>
<text x="384.92" y="424.84" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="153.65" lengthAdjust="spacing">에 의하여 면제되었으나, </text>
<text x="56.69" y="448.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">같은 법률 제21조 제3항의 규정에 따라 귀학교회계 귀속사유가 발생한 때에는 </text>
<text x="56.69" y="471.64" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">즉시 당해 하자보수보증금 상당액을 현금으로 납부할 것을 확약하고, 이에 지급</text>
<text x="56.69" y="495.04" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="111.54" lengthAdjust="spacing">각서를 제출합니다.</text>
<text x="226.13" y="565.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="39.52" lengthAdjust="spacing">20○○</text>
<text x="285.15" y="565.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">.</text>
<text x="315.31" y="565.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">.</text>
<text x="351.97" y="565.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">.</text>
<text x="256.69" y="635.44" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="82.16" lengthAdjust="spacing">계약상대자 주</text>
<text x="351.85" y="635.44" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.77" lengthAdjust="spacing">소:</text>
<text x="328.19" y="658.84" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">상</text>
<text x="353.8" y="658.84" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.77" lengthAdjust="spacing">호:</text>
<text x="328.19" y="682.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="41.99" lengthAdjust="spacing">대표자:</text>
<text x="500.18" y="682.24" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="20.93" lengthAdjust="spacing">(인)</text>
<text x="56.69" y="760.39" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="116.64" lengthAdjust="spacing" font-weight="bold">○○학교장 귀하</text>
</g></g>
