<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 1707.76" width="595.28pt" height="1707.76pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.88"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="68.2" y="89.54" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[참고1]</text>
<text x="246.81" y="127.79" font-size="19" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="101.65" lengthAdjust="spacing" font-weight="bold">지출의 특례</text>
<text x="69.38" y="152.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="469.19" lengthAdjust="spacing">지출은 원칙적으로 당해 회계연도 세출예산의 범위내에서 확정채무의 이행시기가 </text>
<text x="56.69" y="167.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">도래하였을 때 정당한 채권자를 수취인으로 하여 행하여지는 것이 원칙이다. 그러나 </text>
<text x="56.69" y="182.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">이러한 원칙에 의하여 지출하는 것이 부적당하거나 회계의 비효율적 운영을 가져오는 </text>
<text x="56.69" y="197.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">특별한 경우를 예상하여 예외적인 방법에 의하여 지출할 수 있는 지출의 특례를 인정</text>
<text x="56.69" y="212.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="389.66" lengthAdjust="spacing">하고 있으며 지난 회계연도 지출, 선금급, 개산급 등이 이에 해당된다. </text>
<text x="56.69" y="242.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="128.76" lengthAdjust="spacing">① 지난 회계연도 지출 </text>
<text x="68.69" y="257.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.92" lengthAdjust="spacing">㉠ 의의 </text>
<text x="81.59" y="272.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">·</text>
<text x="85.57" y="272.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="453" lengthAdjust="spacing"> 지난 회계연도 지출이란 지난 회계연도에 속하는 채무를 채권자의 청구가 없거나 </text>
<text x="56.69" y="284.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">기타의 사유로 학교회계 출납폐쇄기한내(회계연도 종료후 20일)에 지출하지 못한 </text>
<text x="56.69" y="297.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">경우에 회계연도가 다른 올해 회계연도의 세출예산에서 지출하는 것이다.(지방</text>
<text x="56.69" y="310.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="87.24" lengthAdjust="spacing">회계법 제37조) </text>
<text x="81.81" y="322.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.76" lengthAdjust="spacing">· 학교에 대하여 채권을 가진 자는 채권소멸시효가 완성되기 전까지는 소속 회계</text>
<text x="56.69" y="335.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">연도와 관계없이 채권을 언제나 청구할 수 있기 때문에 이러한 경우에 대비하기 </text>
<text x="56.69" y="347.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="237.72" lengthAdjust="spacing">위한 제도가 지난 회계연도 지출 제도이다. </text>
<text x="68.69" y="360.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.92" lengthAdjust="spacing">㉡ 제한 </text>
<text x="81.81" y="373.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.76" lengthAdjust="spacing">· 지난 회계연도 지출은 과년도 지출을 하기로 결정한 회계연도의 세출예산에서 </text>
<text x="56.69" y="385.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="323.4" lengthAdjust="spacing">지출하여야 하며, 이를 다음 회계연도에 이월시킬 수 없다. </text>
<text x="81.48" y="398.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">·</text>
<text x="85.45" y="398.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="453.12" lengthAdjust="spacing"> 올해 회계연도의 세출예산에서 지출할 수 있는 지출액은 채무가 확정된 회계연도의 </text>
<text x="56.69" y="410.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="342.11" lengthAdjust="spacing">세출예산금액 중에서 불용으로 처리된 금액을 초과해서는 안된다. </text>
<text x="56.69" y="438.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="58.56" lengthAdjust="spacing">② 선금급 </text>
<text x="68.69" y="453.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.92" lengthAdjust="spacing">㉠ 의의 </text>
<text x="87.02" y="468.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="12.74" lengthAdjust="spacing">․ </text>
<text x="99.75" y="468.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="438.82" lengthAdjust="spacing">선금급이란 확정된 채무에 대하여 상대방이 그 책임을 이행하기 전 또는 지급할 </text>
<text x="56.69" y="482.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="432.31" lengthAdjust="spacing">시기가 도래하기 전에 미리 그 대금의 일부 또는 전부를 지급하는 것을 말한다. </text>
<text x="68.69" y="496.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="342.24" lengthAdjust="spacing">㉡ 선금급의 범위 (전북특별자치도 공립학교회계 규칙 제41조) </text>
<text x="80.69" y="509.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="247.56" lengthAdjust="spacing">· 운임 및 사례금·관보 및 정기간행물의 대가 </text>
<text x="82.32" y="523.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="10.51" lengthAdjust="spacing">· </text>
<text x="92.83" y="523.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="445.74" lengthAdjust="spacing">기타 미리 지급하지 아니하면 유치원 및 학교운영 또는 교육활동에 지장을 </text>
<text x="56.69" y="537.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="143.21" lengthAdjust="spacing">초래할 우려가 있는 경비 </text>
<text x="56.69" y="566.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="58.56" lengthAdjust="spacing">③ 개산급 </text>
<text x="68.69" y="581.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.92" lengthAdjust="spacing">㉠ 개요 </text>
<text x="81.58" y="595.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="10.21" lengthAdjust="spacing">· </text>
<text x="91.79" y="595.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="446.78" lengthAdjust="spacing">개산급이란 채무는 존재하나 그 금액이 미확정인 경우에 개략 금액으로 채무이행 </text>
<text x="56.69" y="608.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">시기 도래 이전에 지급하고 집행실적에 의하여 채무액을 확정·정산하는 것을 </text>
<text x="56.69" y="622.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="44.76" lengthAdjust="spacing">말한다. </text>
<text x="81.81" y="636.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.76" lengthAdjust="spacing">· 개산급은 채무이행 시기 도래 이전에 지급하는 점에 있어서 선금급과 유사하나</text>
<text x="56.69" y="650.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">『채무금액의 미확정』이란 점에서 구별되며, 개산급은 채무 미확정금액에 대한 </text>
<text x="56.69" y="664.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="395.4" lengthAdjust="spacing">지급이므로 사후 그것이 확정되었을 때에는 반드시 정산을 필요로 한다. </text>
<text x="68.69" y="677.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="342.24" lengthAdjust="spacing">㉡ 개산급의 범위 (전북특별자치도 공립학교회계 규칙 제42조) </text>
<text x="80.69" y="691.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="260.16" lengthAdjust="spacing">· 여비·업무추진비(직책급업무수행경비에 한한다)</text>
<text x="82.27" y="705.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.3" lengthAdjust="spacing">· 현장체험학습비·수련활동비 등 성질상 개산하여 지급하지 아니하면 학교운영 </text>
<text x="56.69" y="719.24" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="268.8" lengthAdjust="spacing">또는 교육활동에 지장을 초래할 우려가 있는 경비</text>
<text x="80.69" y="733.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="9.84" lengthAdjust="spacing" fill="#FF0000">· </text>
<text x="90.53" y="733.04" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="410.52" lengthAdjust="spacing">학급교육활동경비(학급운영비) 등 교육감이 특히 필요하다고 인정하는 경비 </text>
<text x="68.69" y="746.84" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="342.24" lengthAdjust="spacing">㉢ 개산급의 정산 (전북특별자치도 공립학교회계 규칙 제42조) </text>
<text x="86.48" y="760.64" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="452.09" lengthAdjust="spacing">․ 개산급을 받은 자는 그 경비를 지출한 후 5일 이내에 정산서를 작성하여 증빙서와 </text>
<text x="56.69" y="774.44" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="185.08" lengthAdjust="spacing">함께 출납원에게 제출하여야 한다. </text>
</g></g>
<g data-page="2" transform="translate(0 865.88)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="68.69" y="81.05" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="181.32" lengthAdjust="spacing">㉣ 정산결과 과부족 시 처리방법 </text>
<text x="80.69" y="94.85" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="9.84" lengthAdjust="spacing">· </text>
<text x="90.53" y="94.85" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="427.16" lengthAdjust="spacing">잔액이 생겼을 때에는 반납고지서에 의하여 당초 지출과목에 반납(여입) 조치한다. </text>
<text x="80.69" y="108.65" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="282.48" lengthAdjust="spacing">· 부족금이 생겼을 때에는 청구서를 받아 지출한다. </text>
<text x="80.69" y="122.45" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">·</text>
<text x="84.53" y="122.45" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="428.71" lengthAdjust="spacing"> 여비, 직책급업무수행경비의 경우 과부족이 없을 때에는 정산서를 제출하지 아니할 수 있다.</text>
</g></g>
</svg>