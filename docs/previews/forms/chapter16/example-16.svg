<text x="170.33" y="130.05" font-size="20" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="254.6" lengthAdjust="spacing" font-weight="bold">계 약 보 증 금 지 급 각 서</text>
<text x="56.69" y="207.51" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="375.9" lengthAdjust="spacing">계 약 건 명: ○○○○ 용역 계약/○○○○ 물품(교구) 구입</text>
<text x="56.69" y="237.43" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="260.68" lengthAdjust="spacing">계 약 금 액: 금8,000,000원(금팔백만 원)</text>
<text x="56.69" y="267.35" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="248.08" lengthAdjust="spacing">계약 보증금: 금800,000원(금팔십만 원)</text>
<text x="56.69" y="308.67" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="380.38" lengthAdjust="spacing">계약이행기간: 20○○.○○.○○.(화) ~ 20○○.○○.○○.(토)</text>
<text x="70.61" y="354.91" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="467.96" lengthAdjust="spacingAndGlyphs">위의 계약을 체결함에 있어 계약금액의 10/100이상의 계약보증금을 납부하여야 </text>
<text x="56.69" y="377.18" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacingAndGlyphs">하나 지방자치단체를 당사자로 하는 계약에 관한 법률시행령 제53조 제1항 제2호의 </text>
<text x="56.69" y="398.62" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">규정에 의하여 면제혜택을 받고자 하오니 허용하여 주시고 계약불이행으로 국고귀속 </text>
<text x="56.69" y="420.06" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">사유가 발생할 때에는 면제받은 해당금액을 현금으로 지체없이 납입할 것을 보장하오며 </text>
<text x="56.69" y="441.5" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">만일 납부하지 아니할 때에는 어떠한 제재도 감수할 것을 확약하고 이에 대한 지급각서를 </text>
<text x="56.69" y="462.94" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="66.34" lengthAdjust="spacing">제출합니다. </text>
<text x="214.82" y="549.55" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="56.14" lengthAdjust="spacing">20○○년</text>
<text x="284.96" y="549.55" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="40.74" lengthAdjust="spacing">○○월</text>
