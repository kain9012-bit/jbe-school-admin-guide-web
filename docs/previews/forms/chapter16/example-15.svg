<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 1707.76" width="595.28pt" height="1707.76pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.88"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="96.64" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="44.16" lengthAdjust="spacing">[예시15]</text>
<text x="146.83" y="146.05" font-size="20" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="301.6" lengthAdjust="spacing" font-weight="bold">○○○학교 위탁급식 운영 계약서</text>
<text x="82.53" y="190.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="456.04" lengthAdjust="spacing">○○○학교(이하 “발주처”라 칭한다)과 ○○○(이하 “계약상대자”라 칭한다)은 </text>
<text x="56.69" y="207.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">“계약상대자”이 “발주처”의 20○○. ○. ○○. ~ 20○○. ○. ○○.까지 ○○사업 </text>
<text x="56.69" y="225.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="357.66" lengthAdjust="spacing">위탁급식과 관련하여 다음과 같이 학교급식운영 계약을 체결한다.</text>
<text x="56.69" y="260.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제1조(목적) 본 계약은 “계약상대자”가 “발주처”의 학생들에게 제공하는 급식을 </text>
<text x="56.69" y="277.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">효</text>
<text x="68.12" y="277.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.45" lengthAdjust="spacing">율적이고 위생적으로 수행하기 위한 책임과 의무를 규정하고 “발주처”와 “계약상대자”의 </text>
<text x="56.69" y="294.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="189.35" lengthAdjust="spacing">기본준수사항을 정하는데 목적이 있다.</text>
<text x="56.69" y="329.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제2조(운영의 기본원칙) ①“계약상대자”는 학교급식 관련 법령의 제반규정과 “발주처”와 </text>
<text x="56.69" y="347.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="168.41" lengthAdjust="spacing">합의한 사항을 준수하여야 한다. </text>
<text x="75.97" y="364.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="462.6" lengthAdjust="spacing">② “계약상대자”는 계약기간동안 신선한 재료를 위생적으로 조리 가공하여 학생</text>
<text x="56.69" y="381.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="120.6" lengthAdjust="spacing">에게 제공하여야 한다.</text>
<text x="56.69" y="416.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="443.16" lengthAdjust="spacing">제3조 (영양기준) 학생들에게 제공되는 급식 내용은 밥, 국 및 찬 ○가지로 한다. </text>
<text x="56.69" y="451.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="423.6" lengthAdjust="spacing">제4조 (급식 공급가격) 급식의 1식당 가격은 금0,000원(금______원)으로 한다.</text>
<text x="56.69" y="486.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="98.58" lengthAdjust="spacing">제5조 (공급방법)</text>
<text x="168.4" y="486.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="370.17" lengthAdjust="spacing">“계약상대자”는 학생들에게 급식을 제공함에 있어 “발주처”와 </text>
<text x="56.69" y="503.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="377.64" lengthAdjust="spacing">“계약상대자”가 합의에 의해 지정한 시간과 장소에 배식하여야 한다. </text>
<text x="56.69" y="538.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="462.24" lengthAdjust="spacing">제6조 (급식대금 수납) ① 지방자치단체를 당사자로 하는 계약에 관한 법률에 준한다.</text>
<text x="76.55" y="555.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.47" lengthAdjust="spacing">② </text>
<text x="96.02" y="555.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="442.55" lengthAdjust="spacing">대가의 지급은 급식계약기간이 완료된 후 “계약상대자”의 청구에 의하여 </text>
<text x="56.69" y="573.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="317.18" lengthAdjust="spacing">“발주처”는 5일 이내에 계좌입금하는 것을 원칙으로 한다.</text>
<text x="74.69" y="590.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="424.2" lengthAdjust="spacing">③ “계약상대자”의 귀책사유로 급식을 못한 경우에는 일할 계산하여 환불한다.</text>
<text x="56.69" y="625.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="35.88" lengthAdjust="spacing">제7조 </text>
<text x="92.57" y="625.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="441.18" lengthAdjust="spacing">(계약기간) 계약기간은 20○○년 ○월 ○○일에서 20○○년 ○월 ○○일까지로 한다. </text>
<text x="56.69" y="660.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="374.64" lengthAdjust="spacing">제8조 (계약의 해지) “발주처”는 다음의 경우 계약을 해지할 수 있다.</text>
<text x="75.95" y="677.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="462.62" lengthAdjust="spacing">① “계약상대자”가 “발주처”가 납득 할만한 특별한 사유 없이 급식을 제공하지 </text>
<text x="56.69" y="695.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">못하거나 공급내용이 부실하여 “발주처”가 학교급식의 목적을 달성하기 어렵다고 </text>
<text x="56.69" y="712.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="75.84" lengthAdjust="spacing">판단되는 경우</text>
<text x="76" y="729.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="18.92" lengthAdjust="spacing">② </text>
<text x="94.92" y="729.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="443.65" lengthAdjust="spacing">“계약상대자”가 본 계약사항을 준수하지 않거나 필요한 사항에 대하여 “발주처”가 </text>
<text x="56.69" y="747.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="359.79" lengthAdjust="spacing">시정요구한 사항을 정당한 이유없이 “계약상대자”이 이행하지 않는 경우</text>
<text x="75.52" y="764.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="18.45" lengthAdjust="spacing">③ </text>
<text x="93.97" y="764.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="444.6" lengthAdjust="spacing">천재지변 기타 불가항력적인 사유 및 정부시책 또는 법규의 변경으로 인하여 </text>
<text x="56.69" y="782.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="224.1" lengthAdjust="spacing">계속적인 대체급식이 불가능하게 된 경우</text>
</g></g>
<g data-page="2" transform="translate(0 865.88)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="76.66" y="81.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.57" lengthAdjust="spacing">④ </text>
<text x="96.22" y="81.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="442.35" lengthAdjust="spacing">“계약상대자”가 위생관리 부주의로 식중독이 발생하여 “발주처”의 학생 </text>
<text x="56.69" y="98.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="244.31" lengthAdjust="spacing">또는 교직원에게 건강상 피해를 끼쳤을 경우</text>
<text x="56.69" y="133.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="117.82" lengthAdjust="spacing">제9조 (위생관리) ① </text>
<text x="174.51" y="133.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="364.06" lengthAdjust="spacing">“계약상대자”는 학교급식법 제12조 및 같은 법 시행규칙 제6조의 </text>
<text x="56.69" y="150.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="192.51" lengthAdjust="spacing">규정에 의한사항을 준수하여야 한다.</text>
<text x="75.89" y="168.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="18.82" lengthAdjust="spacing">② </text>
<text x="94.71" y="168.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="443.86" lengthAdjust="spacing">“계약상대자”는 식품위생법 관리 규정과 “발주처”와 또는 교육감이 시달하는 </text>
<text x="56.69" y="185.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="397.03" lengthAdjust="spacing">위생에 관련된 사항을 성실히 준수하여 위생관리에 만전을 기하여야 한다.</text>
<text x="75.4" y="202.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="463.17" lengthAdjust="spacing">③ “계약상대자”는 제1항 내지 제2항에 불구하고 위생으로 인하여 야기된 일체의 </text>
<text x="56.69" y="220.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="296.88" lengthAdjust="spacing">사안에 대하여 민․형사 및 행정상의 모든 책임을 진다.</text>
<text x="56.69" y="255.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="109.6" lengthAdjust="spacing">제10조 (안전관리) </text>
<text x="166.29" y="255.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="372.28" lengthAdjust="spacing">① “계약상대자”는 화재, 폭발, 도난, 안전사고 등이 발생하지 </text>
<text x="56.69" y="272.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">않도록 안전보안 관리를 위하여 제반조치를 취해야 하며, 불의의 사고가 발생하였을 </text>
<text x="56.69" y="289.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="232.5" lengthAdjust="spacing">경우 “계약상대자”가 전적으로 책임을 진다.</text>
<text x="56.69" y="324.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="102.72" lengthAdjust="spacing">제11조 (일반관리) </text>
<text x="159.41" y="324.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="356.77" lengthAdjust="spacing">① “계약상대자”는 급식장소를 항상 깨끗하게 유지 관리하여야 한다.</text>
<text x="76.75" y="342.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="461.82" lengthAdjust="spacing">②“계약상대자”는 급식을 통하여 발생하는 쓰레기 및 잔반은 급식당일 “계약</text>
<text x="56.69" y="359.45" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="188.25" lengthAdjust="spacing">상대자”의 책임하에 수거처리한다.</text>
<text x="56.69" y="394.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제12조 (기타사항) ① 본 계약서에 규정하지 아니한 사항에 대하여는 “발주처”와 </text>
<text x="56.69" y="411.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">“계약상대자”가 협의하여 처리한다. 단, “발주처”와 “계약상대자”의 조문 </text>
<text x="56.69" y="429.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="304.45" lengthAdjust="spacing">해석상의 차이가 있을시에는 “발주처”의 해석에 따른다.</text>
<text x="69.69" y="463.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="468.88" lengthAdjust="spacing">본 계약을 증명하기 위하여 계약서 2부를 작성하여 “발주처”와 “계약상대자”가 </text>
<text x="56.69" y="481.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="203.4" lengthAdjust="spacing">서명 날인하고 각각 1부씩 보관한다. </text>
<text x="232.47" y="550.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="48.12" lengthAdjust="spacing">20○○년</text>
<text x="292.59" y="550.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="23.28" lengthAdjust="spacing">○월</text>
<text x="327.87" y="550.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="34.92" lengthAdjust="spacing">○○일</text>
<text x="56.69" y="637.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.76" lengthAdjust="spacing">발주처:</text>
<text x="269.45" y="637.85" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="68.04" lengthAdjust="spacing">계약상대자: </text>
<text x="56.69" y="655.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="46.56" lengthAdjust="spacing">○○학교</text>
<text x="349.25" y="655.25" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="34.92" lengthAdjust="spacing">○○○</text>
<text x="56.69" y="672.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="175.32" lengthAdjust="spacing">전북 ○○군 ○○면 ○○로 ○○</text>
<text x="268.01" y="672.65" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="175.32" lengthAdjust="spacing">전북 ○○군 ○○면 ○○로 ○○</text>
<text x="56.69" y="690.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="124.44" lengthAdjust="spacing">○○학교장 ○○○ (인)</text>
<text x="319.13" y="690.05" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="60.24" lengthAdjust="spacing">○○○ (인)</text>
</g></g>
</svg>