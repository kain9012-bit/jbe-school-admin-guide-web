<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="165.43" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[참고2]</text>
<rect x="58.1" y="217.38" width="481.69" height="564.89" fill="#FFFFFF"/>
<text x="157.11" y="208.44" font-size="18" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="96.3" lengthAdjust="spacing" font-weight="bold" fill="#292929">총액계약과 </text>
<text x="253.41" y="208.44" font-size="18" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="78.84" lengthAdjust="spacing" font-weight="bold">공공요금 </text>
<text x="332.25" y="208.44" font-size="18" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="113.76" lengthAdjust="spacing" font-weight="bold" fill="#292929">관리의 차이점</text>
<text x="59.51" y="247.5" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="322.42" lengthAdjust="spacing" font-weight="bold">1. 회계연도 개시 前 계약(지방자치단체를 당사자로 하는 계약에 관한 법률 제23조)</text>
<text x="68.33" y="267.9" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">▸</text>
<text x="76.88" y="267.9" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="460.13" lengthAdjust="spacing">임차. 운송, 보관 기타 그 성질상 중단할 수 없는 계약에 있어서는 회계연도 개시전에 당해연도에 확정된 범위 안에서 미리</text>
<text x="59.51" y="288.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="51.19" lengthAdjust="spacing">계약체결 가능</text>
<text x="68.06" y="308.7" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">▸</text>
<text x="76.35" y="308.7" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="436.97" lengthAdjust="spacing">효력은 당해 회계연도 개시일 이후 또는 그 예산배정 이후에 발생(지방자치단체를 당사자로 하는 계약에 관한 법률 시행령 제76조)</text>
<text x="76.61" y="329.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="345.25" lengthAdjust="spacing">예) 전산장비 유지보수, 무인경비용역료, 방화관리용역계약 등 성질상 중단이 곤란한 사업</text>
<text x="59.51" y="369.9" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="140.9" lengthAdjust="spacing" font-weight="bold">2. 용역료【총액계약】 업무 처리 절차</text>
<text x="68.06" y="390.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="264.88" lengthAdjust="spacing">▸총액계약: 당해 계약목적물 전체에 대하여 총액으로 체결하는 계약</text>
<text x="68.06" y="410.7" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="273.43" lengthAdjust="spacing">▸업무 처리 절차: 총계약금액으로 계약 후 검사검수를 통한 분할 지급</text>
<text x="76.61" y="431.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="8.98" lengthAdjust="spacing">- </text>
<text x="85.59" y="431.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.1" lengthAdjust="spacing">대상: </text>
<text x="108.69" y="431.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="404.83" lengthAdjust="spacing">계약을 체결하여 매월 용역료를 지급하는 건에 해당됨.(무인경비용역료, 방화관리용역비, 컴퓨터유지보수비 등</text>
<text x="513.52" y="431.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">)</text>
<text x="76.61" y="451.5" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="391.5" lengthAdjust="spacing">- 지출품의: 총지급예정금액 전액 품의(12월로 분할지급), 본예산확정 후 회계연도 개시 전 품의 가능</text>
<text x="76.61" y="471.9" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="65.75" lengthAdjust="spacing">- 지출원인행위: </text>
<text x="142.36" y="471.9" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="177.4" lengthAdjust="spacing">회계연도 개시 전 원인행위가능, 연간총액으로 계약</text>
<text x="76.61" y="492.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="265.82" lengthAdjust="spacing">- 검사검수: 매월 말 분할하여 기성으로 검사검수 처리 후 대금 지급</text>
<text x="85.16" y="512.7" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="286.43" lengthAdjust="spacing">①1차 대금지급: 기성으로 당월 요청할 금액만 입력한 후 검사검수 요청함</text>
<text x="85.16" y="533.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="390.05" lengthAdjust="spacing">②차기 대금지급: 검사검수 시 검사추가를 선택하여 당월 요청 할 금액만 입력한 후 검사검수 요청함</text>
<text x="80.89" y="553.5" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="265.91" lengthAdjust="spacing">※ 공공요금관리: 품의는 생략가능하나 매월 지출 원인행위가 필요함.</text>
<text x="59.51" y="594.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="76.66" lengthAdjust="spacing" font-weight="bold">3. 공공요금관리: </text>
<text x="136.17" y="594.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="405.02" lengthAdjust="spacing">매월 정기적으로 지급하는 직책급업무수행경비, 신문구독료, 공과금 등에 대하여, 지급계획을 </text>
<text x="59.51" y="614.7" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="455.77" lengthAdjust="spacing">작성해서 지출업무를 보다 간편하게 처리하는 것으로, 품의를 하지 않고 바로 원인행위가 가능함.</text>
<text x="59.51" y="635.1" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="178.87" lengthAdjust="spacing">(단, 신문구독료는 구독 기안이 선행되어야 함)</text>
<text x="59.51" y="675.9" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="316.78" lengthAdjust="spacing" font-weight="bold">4. 공공요금관리와 총액계약(총액으로 계약 후 검사검수를 통한 분할 지급)의 비교</text>
<text x="110.41" y="699.12" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" font-weight="bold" fill="#292929">구</text>
<text x="127.26" y="699.12" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" font-weight="bold" fill="#292929">분</text>
<text x="225.06" y="699.12" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="49.76" lengthAdjust="spacing" font-weight="bold">공공요금관리</text>
<text x="409.83" y="699.12" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="33.17" lengthAdjust="spacing" font-weight="bold">총액계약</text>
<text x="82.92" y="716.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="80.11" lengthAdjust="spacing" fill="#292929">지출품의(사업담당자)</text>
<text x="222.92" y="716.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="54.04" lengthAdjust="spacing" fill="#292929">품의생략 가능</text>
<text x="380.34" y="716.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="92.17" lengthAdjust="spacing" fill="#292929">연초 1회 지출품의 필요</text>
<text x="82.92" y="734.42" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="80.11" lengthAdjust="spacing" fill="#292929">지출원인행위(학교장)</text>
<text x="214.63" y="734.42" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="70.62" lengthAdjust="spacing" fill="#292929">매월 지출원인행위</text>
<text x="382.47" y="734.42" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="87.89" lengthAdjust="spacing" fill="#292929">연초 1회 지출원인행위</text>
<text x="91.22" y="752.07" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.53" lengthAdjust="spacing" fill="#292929">지출결의(출납원)</text>
<text x="222.92" y="752.07" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="54.04" lengthAdjust="spacing" fill="#292929">매월 지출결의</text>
<text x="399.4" y="752.07" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="54.04" lengthAdjust="spacing" fill="#292929">매월 지출결의</text>
