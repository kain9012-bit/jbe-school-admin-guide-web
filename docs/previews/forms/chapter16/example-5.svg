<text x="68.69" y="342.19" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="314.16" lengthAdjust="spacing">나. 전북특별자치도 교육비특별회계 재무회계 규칙 제3조 </text>
<text x="68.69" y="361.39" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="396" lengthAdjust="spacing">다. 전북특별자치도 교육비특별회계 소관 물품 관리 조례 시행규칙 제3조</text>
<text x="56.69" y="380.59" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">2. 행정실장의 장기 병가로 인해 직무상 공백이 발생함에 따라 원활한 회계 운영을 위</text>
<text x="56.69" y="399.79" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="278.28" lengthAdjust="spacing">하여 아래와 같이 임시출납원을 임명하고자 합니다.</text>
