<text x="68.33" y="308.97" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="318.24" lengthAdjust="spacing">가. 전북특별자치도 공립학교회계 규칙 제15조(추가경정예산)</text>
<text x="68.33" y="328.17" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="277.26" lengthAdjust="spacing">나. 20○○학년도 ○○초 학교회계 예산총칙 제○조 </text>
<text x="56.69" y="347.37" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.87" lengthAdjust="spacing">2. </text>
