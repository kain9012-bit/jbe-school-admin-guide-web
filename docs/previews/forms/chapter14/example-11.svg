<text x="108.49" y="347.37" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="423.98" lengthAdjust="spacing">. 2월말 ○○교육지원청으로부터 체육기구 구입지원으로 목적사업비가 교부되었으나,</text>
<text x="56.69" y="366.57" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="452.69" lengthAdjust="spacing">일정상 학교운영위원회를 다시 소집하여 추가경정예산을 심의하기가 현실적으로 어려워,</text>
<text x="56.69" y="385.77" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">3. 부득이하게 학교운영위원회의 심의절차를 생략하고, 다음과 같이 간주처리 예산을 </text>
<text x="56.69" y="404.97" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="155.52" lengthAdjust="spacing">편성하여 집행하고자 합니다.</text>
