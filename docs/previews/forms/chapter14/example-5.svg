<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.86" width="595.28pt" height="841.86pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.86"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="43.56" lengthAdjust="spacing">[예시5] </text>
<text x="189.38" y="133.39" font-size="20" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="216.5" lengthAdjust="spacing" font-weight="bold">예·결산소위원회 규정(안)</text>
<text x="56.69" y="160.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="54.77" lengthAdjust="spacing" font-weight="bold">제1조(목적)</text>
<text x="111.46" y="160.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="262.93" lengthAdjust="spacing"> 이 규정은 전북특별자치도 도립학교 운영위원회 설치</text>
<text x="374.39" y="160.74" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">･</text>
<text x="384.42" y="160.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="154.15" lengthAdjust="spacing">운영에 관한 조례 제16조 및 ○</text>
<text x="56.69" y="178.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="210.05" lengthAdjust="spacing">○학교운영위원회규정 제○○조에 따라 예</text>
<text x="266.74" y="178.34" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">･</text>
<text x="277.02" y="178.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="213.48" lengthAdjust="spacing">결산소위원회(이하 &quot;위원회&quot;라 한다)의 설치</text>
<text x="490.51" y="178.34" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">･</text>
<text x="500.79" y="178.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="37.78" lengthAdjust="spacing">운영에 </text>
<text x="56.69" y="195.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="211.93" lengthAdjust="spacing">관하여 필요한 사항을 정함을 목적으로 한다.</text>
<text x="56.69" y="214.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="51.27" lengthAdjust="spacing" font-weight="bold">제2조(기능</text>
<text x="107.96" y="214.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="8.85" lengthAdjust="spacing">) </text>
<text x="116.81" y="214.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="31.08" lengthAdjust="spacing">위원회</text>
<text x="147.89" y="214.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="385.28" lengthAdjust="spacing">는 학교회계 예산 및 결산, 학교발전기금의 효율적인 운영을 위하여 다음 각 호의</text>
<text x="56.69" y="232.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="55.91" lengthAdjust="spacing">사항을 검토</text>
<text x="112.6" y="232.14" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">･</text>
<text x="122.69" y="232.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="46.29" lengthAdjust="spacing">자료수집․</text>
<text x="168.98" y="232.14" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">･</text>
<text x="179.07" y="232.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="216.84" lengthAdjust="spacing">조사하여 심사 후 학교운영위원회에 보고한다.</text>
<text x="67.14" y="249.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="319.56" lengthAdjust="spacing">1. 학교회계 예산편성 및 결산에 관한 사항(단, 추가경정예산 제외) </text>
<text x="67.14" y="267.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="100.63" lengthAdjust="spacing">2. 학교발전기금 조성</text>
<text x="167.77" y="267.34" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.01" lengthAdjust="spacing">･운</text>
<text x="186.79" y="267.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="71.27" lengthAdjust="spacing">용에 관한 사항</text>
<text x="67.14" y="284.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="339.94" lengthAdjust="spacing">3. 기타 학교운영위원회에서 위임한 학교회계 예산 및 결산에 관한 사항</text>
<text x="56.69" y="302.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="52.98" lengthAdjust="spacing" font-weight="bold">제3조(구성)</text>
<text x="114.9" y="302.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="230.03" lengthAdjust="spacing">① 위원회는 위원장 및 부위원장 각 1인을 포함한 </text>
<text x="344.93" y="302.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif">○</text>
<text x="355.06" y="302.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="56.76" lengthAdjust="spacing">명으로 한다.</text>
<text x="66.26" y="320.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="399.16" lengthAdjust="spacing">② 위원장과 부위원장은 위원 중에서 각각 호선하며 간사는 위원 중에서 위원장이 지명한다.</text>
<text x="66.7" y="337.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="310.41" lengthAdjust="spacing">③ 위원은 다음 각 호의 자 중에서 학교운영위원회의 의결로 정한다.</text>
<text x="81.72" y="355.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="106.11" lengthAdjust="spacing">1. 학교운영위원회 위원</text>
<text x="81.72" y="372.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.84" lengthAdjust="spacing">2. 교직원</text>
<text x="81.72" y="390.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="47.85" lengthAdjust="spacing">3. 학부모 </text>
<text x="81.72" y="408.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="57.56" lengthAdjust="spacing">4. 학생 대표</text>
<text x="67.16" y="425.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="15.39" lengthAdjust="spacing">④ </text>
<text x="82.56" y="425.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="445.54" lengthAdjust="spacing">학교별 실정과 여건에 따라 위원회 구성원, 규모, 성격 등을 충분히 고려하여 학교운영위원회의</text>
<text x="56.69" y="443.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="247.56" lengthAdjust="spacing">의결로 학교운영위원회와 통합하여 운영할 수 있다. </text>
<text x="67.14" y="460.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="357.18" lengthAdjust="spacing">⑤ 학생수 100명 미만인 학교는 예․결산소위원회를 구성하지 않을 수 있다.</text>
<text x="56.69" y="478.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="93.84" lengthAdjust="spacing" font-weight="bold">제4조(위원의 임기) </text>
<text x="150.53" y="478.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="216.11" lengthAdjust="spacing">위원의 임기는 1년으로 하며, 연임할 수 있다.</text>
<text x="56.69" y="496.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="120.12" lengthAdjust="spacing" font-weight="bold">제5조(위원장 등의 직무)</text>
<text x="182.31" y="496.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="263.55" lengthAdjust="spacing">① 위원장은 위원회를 대표하고, 위원회의 업무를 통할한다.</text>
<text x="67.48" y="513.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="471.09" lengthAdjust="spacing">② 부위원장은 위원장을 보좌하며, 위원장이 부득이한 사유로 직무를 수행할 수 없는 때에는 그 </text>
<text x="56.69" y="531.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="79.52" lengthAdjust="spacing">직무를 대행한다.</text>
<text x="67.14" y="548.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="201.79" lengthAdjust="spacing">③ 간사는 위원회의 사무 처리를 담당한다.</text>
<text x="56.69" y="566.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="71.92" lengthAdjust="spacing" font-weight="bold">제6조(회의 등)</text>
<text x="128.61" y="566.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="21.66" lengthAdjust="spacing"> ① </text>
<text x="150.27" y="566.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="388.3" lengthAdjust="spacing">회의소집은 위원장 또는 재적위원 3분의 1이상의 요구가 있을 때 위원장이 </text>
<text x="56.69" y="584.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="45.28" lengthAdjust="spacing">소집한다.</text>
<text x="67.14" y="601.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="454.26" lengthAdjust="spacing">② 위원회 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.</text>
<text x="56.69" y="619.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="156.2" lengthAdjust="spacing" font-weight="bold">제7조(심사보고서 제출 및 보고)</text>
<text x="218.34" y="619.34" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="320.23" lengthAdjust="spacing">위원회는 안건 심사 후 심사보고서를 작성하여 학교운영위원회에 </text>
<text x="56.69" y="636.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="48.6" lengthAdjust="spacing">제출하고, </text>
<text x="105.29" y="636.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="111.81" lengthAdjust="spacing">위원회장은 심사의견을 </text>
<text x="217.1" y="636.94" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="43.43" lengthAdjust="spacing">보고한다.</text>
<text x="56.69" y="654.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="76.9" lengthAdjust="spacing" font-weight="bold">제8조(운영세칙)</text>
<text x="139.07" y="654.54" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="399.5" lengthAdjust="spacing">이 규정에서 정하지 아니한 위원회의 운영에 관하여 필요한 사항은 소위원회의 </text>
<text x="56.69" y="672.14" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="70.12" lengthAdjust="spacing">의결로 정한다.</text>
<text x="279.66" y="689.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold">부</text>
<text x="305.47" y="689.74" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold">칙</text>
<text x="67.14" y="708.19" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="26.02" lengthAdjust="spacing" font-weight="bold">제1조</text>
<text x="99.16" y="708.19" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="45.77" lengthAdjust="spacing">본 규정은</text>
<text x="160.61" y="708.19" font-size="11" font-family="'HY신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="162.29" lengthAdjust="spacing">20○○년 ○월 ○일부터 시행한다.</text>
<text x="67.5" y="742.74" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="24.21" lengthAdjust="spacing" font-weight="bold">※ 예</text>
<text x="91.7" y="742.74" font-size="10.5" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">･</text>
<text x="102.65" y="742.74" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="263.02" lengthAdjust="spacing" font-weight="bold">결산소위원회 규정은 학교 실정에 맞게 변경하여 운영</text>
<text x="56.69" y="760.34" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="41.48" lengthAdjust="spacing" font-weight="bold">(예시: 예</text>
<text x="98.17" y="760.34" font-size="11" font-family="'한양중고딕','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">⋅</text>
<text x="108.1" y="760.34" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="282.34" lengthAdjust="spacing" font-weight="bold">결산소위원회 구성 시 학교운영위원회 위원으로만 구성 가능)</text>
</g></g>
</svg>