<text x="72.49" y="347.17" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="90.41" lengthAdjust="spacing">주시기 바랍니다.</text>
<text x="56.69" y="385.57" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.28" lengthAdjust="spacing">붙임</text>
<text x="91.97" y="385.57" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="194.4" lengthAdjust="spacing">1. 학교회계 세입 · 세출결산서 1부.</text>
<text x="92.69" y="404.77" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="143.64" lengthAdjust="spacing">2. 예비비 사용명세서 1부.</text>
<text x="92.69" y="423.97" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="182.76" lengthAdjust="spacing">3. 세출예산 이 · 전용명세서 1부.</text>
<text x="92.69" y="443.17" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="108.72" lengthAdjust="spacing">4. 계속비 조서 1부.</text>
<text x="92.69" y="462.37" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="299.16" lengthAdjust="spacing">5. 명시이월 및 사고이월명세서, 계속비이월명세서 1부.</text>
<text x="92.69" y="481.57" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="202.2" lengthAdjust="spacing">6. 기타 결산심의에 필요한 자료 1부.</text>
<text x="306.89" y="481.57" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="15.48" lengthAdjust="spacing">끝.</text>
<text x="104.69" y="500.77" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="355.99" lengthAdjust="spacing">※ 2~5번은 해당사항이 없으면 “해당사항 없음”으로 기재하여 함께 제출</text>
