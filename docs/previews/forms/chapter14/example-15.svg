<text x="56.69" y="327.97" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.75" lengthAdjust="spacing">2. </text>
<text x="73.44" y="327.97" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="353.04" lengthAdjust="spacing">20○○학년도 학교회계 결산(안)을 붙임과 같이 학교운영위원회에</text>
