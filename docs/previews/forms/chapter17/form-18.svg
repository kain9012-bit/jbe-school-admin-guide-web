<text x="56.69" y="112.83" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="45.75" lengthAdjust="spacing">[서식 18]</text>
<text x="82.13" y="174.65" font-size="17" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="418.91" lengthAdjust="spacing">물품 다수공급자계약 2단계경쟁 5개사 미만 제안요청 사유서</text>
<text x="69.49" y="233.3" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="45.22" lengthAdjust="spacing">기관명:</text>
<text x="69.49" y="255.7" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="92.96" lengthAdjust="spacing">제안요청건명: </text>
<text x="83.73" y="307.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="217.86" lengthAdjust="spacing">(학교명)은 물품 다수공급자계약 2</text>
<text x="301.59" y="307.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="212.1" lengthAdjust="spacing">단계경쟁을 실시함에 있어 다음의 사</text>
<text x="69.49" y="329.9" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="25.01" lengthAdjust="spacing">유로</text>
<text x="94.5" y="329.9" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="419.19" lengthAdjust="spacing"> 5개사 미만의 계약상대자를 대상으로 제안요청을 실시하고자 합</text>
<text x="69.49" y="352.3" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="31.64" lengthAdjust="spacing">니다.</text>
<text x="69.49" y="404.1" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="31.64" lengthAdjust="spacing">사유:</text>
<text x="235.05" y="650.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="15.4" lengthAdjust="spacing">20</text>
<text x="250.45" y="650.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="21.93" lengthAdjust="spacing">○○</text>
<text x="272.39" y="650.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">년</text>
<text x="306.97" y="650.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">월</text>
<text x="341.55" y="650.5" font-size="14" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">일</text>
<text x="69.49" y="737.35" font-size="15" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="213.75" lengthAdjust="spacing">(기관명) 계약담당공무원 ○○○</text>
<text x="69.49" y="771.65" font-size="13" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="203.11" lengthAdjust="spacing">※ 본 사유서는 국가종합전자조달</text>
