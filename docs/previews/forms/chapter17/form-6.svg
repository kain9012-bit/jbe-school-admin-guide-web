<text x="79.19" y="249.18" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="92.55" lengthAdjust="spacing">계약보증금 : </text>
<text x="79.19" y="276.18" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="92.55" lengthAdjust="spacing">계약년월일 : </text>
<text x="56.69" y="333.48" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing"> 위와 같이 계약을 체결함에 있어 계약금액의 10/100(행정안전부 장관 특례시 5/100)</text>
<text x="56.69" y="356.88" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="36.14" lengthAdjust="spacing">이상의</text>
<text x="92.83" y="356.88" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="439.13" lengthAdjust="spacing"> 계약보증금을 납부하여야하나 지방자치단체를 당사자로 하는 계약에 관한</text>
<text x="56.69" y="380.28" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">법률 시행령 제53조제1항제2호에 의하여 면제혜택을 받고자 하오니 허용하여 주</text>
<text x="56.69" y="403.68" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">시고 계약불이행으로 국고 귀속사유가 발생 할 때에는 면제받은 금액을 현금으</text>
<text x="56.69" y="427.08" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="45.83" lengthAdjust="spacing">로 지체</text>
<text x="102.52" y="427.08" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="436.05" lengthAdjust="spacing">없이 납입할 것을 보장하오며, 만일 이를 위반할 때에는 어떠한 제재도 감</text>
<text x="56.69" y="450.48" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="55.23" lengthAdjust="spacing">수할 것을</text>
<text x="111.92" y="450.48" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="238.42" lengthAdjust="spacing"> 확약하고 이에 대한 각서를 제출합니다.</text>
<text x="229.19" y="500.78" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="47.55" lengthAdjust="spacing">2025년</text>
