<text x="78.97" y="239.54" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.32" lengthAdjust="spacing">계약금액</text>
