<text x="78.72" y="202.96" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.81" lengthAdjust="spacing">공 사 명</text>
