<text x="241.32" y="276.12" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="111.12" lengthAdjust="spacing">원 (계약금액의 ○%)</text>
<text x="78.97" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.32" lengthAdjust="spacing">계약일자</text>
<text x="175.74" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="48.12" lengthAdjust="spacing">20○○년</text>
<text x="235.86" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="52.56" lengthAdjust="spacing">○월 ○일</text>
<text x="319.87" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.32" lengthAdjust="spacing">준공일자</text>
<text x="418.88" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="52.5" lengthAdjust="spacing">20○○년 </text>
<text x="471.38" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">○</text>
<text x="483.02" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="17.11" lengthAdjust="spacing">월 </text>
<text x="500.13" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">○</text>
<text x="511.77" y="312.7" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">일</text>
<text x="75.71" y="349.28" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="69.84" lengthAdjust="spacing">하자보증기간</text>
<text x="169.68" y="349.28" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="54.12" lengthAdjust="spacing"> 20○○년</text>
<text x="235.8" y="349.28" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="119.28" lengthAdjust="spacing">○월 ○일 ~ 20○○년</text>
<text x="367.08" y="349.28" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="52.56" lengthAdjust="spacing">○월 ○일</text>
<text x="71.57" y="394.18" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.53" lengthAdjust="spacingAndGlyphs">위의 계약을 체결함에 있어 지방자치단체를 당사자로 하는 계약에 관한 법률 시행령 </text>
<text x="65.82" y="413.38" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.28" lengthAdjust="spacing">제71조 및 동법 시행규칙 제70조제2항의 규정에 따라 하자보수보증금 납부를 면제 </text>
<text x="65.82" y="432.58" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.28" lengthAdjust="spacing">받는 바 같은 법 시행령 제71조, 제71조의2 및 제72조의 규정에 의한 지방자치단체 </text>
<text x="65.82" y="451.78" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.28" lengthAdjust="spacing">세입조치의 사유가 발생할 때에는 동 사유 발생일로부터 30일 이내에 하자보수보증</text>
<text x="65.82" y="470.98" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.28" lengthAdjust="spacing">금에 해당하는 금액을 현금으로 납부할 것을 확약하며 동 기한까지 납부하지 않을 </text>
<text x="65.82" y="490.18" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.28" lengthAdjust="spacing">경우 귀 교의 어떠한 조치에도 이의를 제기하지 않을 것을 확약하며 이에 각서를 제출</text>
<text x="65.82" y="509.38" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="44.76" lengthAdjust="spacing">합니다. </text>
<text x="241.25" y="547.78" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="48.12" lengthAdjust="spacing">20○○년</text>
<text x="301.37" y="547.78" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="52.56" lengthAdjust="spacing">○월 ○일</text>
<text x="235.79" y="605.38" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="56.76" lengthAdjust="spacing">업 체 명: </text>
<text x="235.79" y="630.58" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.32" lengthAdjust="spacing">사업자등록번호: </text>
<text x="235.79" y="655.78" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">주</text>
<text x="271.43" y="655.78" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="21.48" lengthAdjust="spacing">소: </text>
<text x="235.79" y="680.98" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.76" lengthAdjust="spacing">대 표 자:</text>
