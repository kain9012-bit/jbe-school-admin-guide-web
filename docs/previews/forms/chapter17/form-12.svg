<text x="152.42" y="128.39" font-size="15" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="293.1" lengthAdjust="spacing">4대 사회보험료 납부여부 정보 제공 동의서</text>
<text x="67.41" y="191.27" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="116.76" lengthAdjust="spacing" font-weight="bold">정보를 제공받을 기관</text>
<text x="193.48" y="165.13" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.68" lengthAdjust="spacing"> 기관명 및 부서:</text>
<text x="193.48" y="191.27" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="120.6" lengthAdjust="spacing"> 기관 담당자전화번호:</text>
<text x="193.48" y="217.41" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="85.68" lengthAdjust="spacing"> 제출 팩스번호:</text>
<text x="84.87" y="249.94" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="81.84" lengthAdjust="spacing" font-weight="bold">정보 이용 목적</text>
<text x="193.48" y="242.14" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="343.56" lengthAdjust="spacing"> 계약대금 지급을 위한 건강·연금·고용·산재 보험료 등의 납부 </text>
<text x="193.48" y="257.74" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="52.56" lengthAdjust="spacing">여부 확인</text>
<text x="102.51" y="288.85" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.56" lengthAdjust="spacing" font-weight="bold">제공정보</text>
<text x="199.48" y="281.05" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="261.62" lengthAdjust="spacing">사업장명, 소재지, 대표자 성명, 대표자 생년월일, </text>
<text x="461.1" y="281.05" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.63" lengthAdjust="spacing">사업자등록</text>
<text x="193.48" y="296.65" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="113.48" lengthAdjust="spacing"> 번호, 사업장관리번호, </text>
<text x="306.96" y="296.65" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="83.13" lengthAdjust="spacing">4대 사회보험료 </text>
<text x="390.1" y="296.65" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="71.2" lengthAdjust="spacing">등의 납부 여부</text>
<text x="67.41" y="321.37" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="116.76" lengthAdjust="spacing" font-weight="bold">정보보유 및 이용기간</text>
<text x="193.48" y="321.37" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.24" lengthAdjust="spacing"> 3년</text>
<text x="60.93" y="355.25" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="22.44" lengthAdjust="spacing"> 1. </text>
<text x="83.37" y="355.25" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="258.06" lengthAdjust="spacing">개인정보보호법 제17조(개인정보의 제공)에 따라 </text>
<text x="341.43" y="355.25" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="149.34" lengthAdjust="spacing">건강·연금·고용·산재보험 등의</text>
<text x="84.21" y="373.25" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="393.56" lengthAdjust="spacing">납부여부 확인 업무와 관련하여 위와 같이 정보를 제공하는 데에 동의합니다.</text>
<text x="78.57" y="406.25" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="458.44" lengthAdjust="spacing">만일 위 정보 제공에 대하여 동의를 하지 아니할 경우에도 불이익은 없지만 동의하지 </text>
<text x="60.93" y="424.25" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="388.08" lengthAdjust="spacing">않은 경우 4대 사회보험료 완납증명서를 직접 발급받아 제출해야 합니다.</text>
<text x="235.73" y="458.1" font-size="13" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.44" lengthAdjust="spacing">동의함□</text>
<text x="299.17" y="458.1" font-size="13" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.05" lengthAdjust="spacing">동의안함□</text>
<text x="60.93" y="485.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.4" lengthAdjust="spacingAndGlyphs">2. </text>
<text x="77.33" y="485.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="374.48" lengthAdjust="spacingAndGlyphs">개인정보보호법 제24조(고유식별정보의 처리제한)에 따라 4대 사회보험료</text>
<text x="451.81" y="485.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.35" lengthAdjust="spacingAndGlyphs"> 납부여부</text>
<text x="502.16" y="485.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="34.85" lengthAdjust="spacingAndGlyphs"> 확인 </text>
<text x="60.93" y="503.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="272.21" lengthAdjust="spacing">업무와 관련하여 개인정보보호법 시행령 제19조</text>
<text x="333.14" y="503.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="97.19" lengthAdjust="spacing">(고유식별정보의 </text>
<text x="430.33" y="503.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="106.68" lengthAdjust="spacing">범위)에 따른 주민</text>
<text x="60.93" y="521.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="476.08" lengthAdjust="spacing">등록번호, 외국인등록번호를 처리하여 위와 같이 정보를 제공하는 데에 동의합니</text>
<text x="60.93" y="539.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="15.94" lengthAdjust="spacing">다.</text>
<text x="79.07" y="572.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="398.75" lengthAdjust="spacing">만일 위 고유식별정보 처리에 대하여 동의를 하지 아니할 경우에도 불이익은 </text>
<text x="477.83" y="572.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="32.03" lengthAdjust="spacing">없지만</text>
<text x="509.86" y="572.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="27.15" lengthAdjust="spacing"> 동의</text>
<text x="60.93" y="590.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="80.81" lengthAdjust="spacing">하지 않은 경우 </text>
<text x="141.74" y="590.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="84.02" lengthAdjust="spacing">4대 사회보험료 </text>
<text x="225.76" y="590.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="134.36" lengthAdjust="spacing">납부여부 확인이 제한될 수</text>
<text x="360.12" y="590.89" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="53.58" lengthAdjust="spacing"> 있습니다.</text>
<text x="235.73" y="624.74" font-size="13" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.44" lengthAdjust="spacing">동의함□</text>
<text x="299.17" y="624.74" font-size="13" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.05" lengthAdjust="spacing">동의안함□</text>
<text x="251.51" y="652.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">년</text>
<text x="293.15" y="652.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">월</text>
<text x="334.79" y="652.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">일</text>
<text x="144.93" y="670.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="33.12" lengthAdjust="spacing">상호 :</text>
<text x="144.93" y="688.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.32" lengthAdjust="spacing">사업자등록번호 :</text>
<text x="144.93" y="706.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="68.04" lengthAdjust="spacing">대표자 성명:</text>
<text x="278.97" y="706.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="222.12" lengthAdjust="spacing">(대표자 서명, 인 또는 기관장 직인 가능)</text>
<text x="144.93" y="724.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="97.32" lengthAdjust="spacing">대표자 생년월일: </text>
<text x="144.93" y="742.45" font-size="12" font-family="'HCR Dotum','함초롬돋움','한컴돋움','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="56.4" lengthAdjust="spacing">전화번호: </text>
