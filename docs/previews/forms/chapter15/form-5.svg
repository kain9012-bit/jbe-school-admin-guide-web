<text x="195.48" y="168.33" font-size="18" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="204.28" lengthAdjust="spacing">개인정보제공동의서</text>
<text x="103.25" y="224.73" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="41.03" lengthAdjust="spacing">○ 성명:</text>
<text x="270.78" y="224.73" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="67.87" lengthAdjust="spacing">○ 생년월일: </text>
<text x="97.75" y="246.73" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.53" lengthAdjust="spacing"> ○ 주소:</text>
<line x1="96.34" y1="204.54" x2="498.91" y2="204.54" stroke="#000000" stroke-width="0.28"/>
<line x1="96.34" y1="259.22" x2="498.91" y2="259.22" stroke="#000000" stroke-width="0.28"/>
<line x1="96.34" y1="204.54" x2="96.34" y2="259.22" stroke="#000000" stroke-width="0.28"/>
<line x1="498.91" y1="204.54" x2="498.91" y2="259.22" stroke="#000000" stroke-width="0.34"/>
<text x="102.46" y="291.28" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="295.37" lengthAdjust="spacing">상기 본인은 국민건강보험공단이 「개인정보보호법 제18조</text>
<text x="397.83" y="291.28" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="29.28" lengthAdjust="spacing">제2항</text>
<text x="427.11" y="291.28" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="9.74" lengthAdjust="spacing">, </text>
<text x="436.85" y="291.28" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="50.84" lengthAdjust="spacing">제3항」에 </text>
<text x="103.62" y="310.48" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="299.59" lengthAdjust="spacing">따라 다음과 같이 개인정보수집목적 외로 개인정보자료를 </text>
<text x="403.21" y="310.48" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="61.63" lengthAdjust="spacing">제공하는데 </text>
<text x="103.92" y="329.68" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="59.56" lengthAdjust="spacing">동의합니다.</text>
<text x="103.59" y="365.52" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="103.4" lengthAdjust="spacing">ⓛ 제공받는 자(기관)</text>
<text x="103.59" y="402.32" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="64.35" lengthAdjust="spacing">② 이용 목적</text>
<text x="103.59" y="439.12" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="64.35" lengthAdjust="spacing">③ 제공 항목</text>
<text x="103.59" y="475.92" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="150.04" lengthAdjust="spacing">④ 개인정보 보유 및 이용기간</text>
<text x="297.62" y="475.92" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="102.81" lengthAdjust="spacing">동의서 작성일로부터 (</text>
<text x="451.58" y="475.92" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">)</text>
<text x="107.18" y="501.23" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="371.69" lengthAdjust="spacing">⑤ 귀하는 개인정보제공에 대해 동의를 거부할 권리가 있으며, 동의를 거부할 경우</text>
<text x="107.18" y="515.55" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="33.23" lengthAdjust="spacing">불이익(</text>
<text x="320.45" y="515.55" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="101.85" lengthAdjust="spacing">)이 있을 수 있습니다.</text>
<text x="193.05" y="568.73" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="133.2" lengthAdjust="spacing">20○○. ○○. ○○.</text>
<text x="257.12" y="600.66" font-size="13" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="25.22" lengthAdjust="spacing" font-weight="bold">성명</text>
<text x="392.84" y="600.66" font-size="13" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="84.37" lengthAdjust="spacing" font-weight="bold">(서명 또는 인)</text>
<text x="75.12" y="631.68" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="225.76" lengthAdjust="spacing"> 국민건강보험공단 이사장 귀하</text>
<text x="210.17" y="654.23" font-size="10" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="174.9" lengthAdjust="spacing">≪개인정보자료제공 동의서 기재요령≫</text>
<text x="75.12" y="669" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="292.93" lengthAdjust="spacing"> ⓛ 개인정보를 제공받는 자 또는 기관 명칭을 기재합니다.</text>
<text x="75.12" y="686.6" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="271.59" lengthAdjust="spacing"> ② 제공 받는 자의 개인정보 이용 목적을 기재합니다.</text>
<text x="75.12" y="704.2" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="249.92" lengthAdjust="spacing"> ③ 제공하는 개인정보의 항목을 모두 기재합니다.</text>
<text x="75.12" y="721.8" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="362.45" lengthAdjust="spacing"> ④ 개인정보를 제공받는 자의 개인정보 보유 및 이용기간을 기재합니다.</text>
<text x="75.12" y="739.4" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="21.67" lengthAdjust="spacing"> ⑤ </text>
<text x="96.79" y="739.4" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="407.53" lengthAdjust="spacing">동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익 고지 여부를 확인합니다.</text>
