<text x="79.5" y="638.02" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="52.23" lengthAdjust="spacingAndGlyphs">이 서식의 </text>
<text x="131.73" y="638.02" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="62.61" lengthAdjust="spacingAndGlyphs">각 조항 외에</text>
<text x="194.34" y="638.02" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="338.83" lengthAdjust="spacingAndGlyphs"> 학교장이 필요하다고 인정할 때에는 이 서식의 각 조항에서 저촉되지</text>
<text x="56.69" y="653.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="47.7" lengthAdjust="spacing">아니하는 </text>
<text x="104.39" y="653.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="58.26" lengthAdjust="spacing">범위 내에서</text>
