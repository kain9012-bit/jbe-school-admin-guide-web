<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 1707.76" width="595.28pt" height="1707.76pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.88"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="59.51" y="101.64" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[서식6]</text>
<text x="182.24" y="147.69" font-size="16" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="230.79" lengthAdjust="spacing" font-weight="bold">공유재산(유상, 무상) 대부계약서</text>
<text x="56.69" y="177.56" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="58.26" lengthAdjust="spacing">재산의 표시</text>
<text x="67.72" y="203.12" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.85" lengthAdjust="spacing">위 재산에 대하여 대부자 ○○학교장을 “갑”이라 하고, 대부 받은 자를 “을”이라 하여 다음과 </text>
<text x="56.69" y="220.16" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="130.57" lengthAdjust="spacing">같이 대부계약을 체결한다.</text>
<text x="56.69" y="245.72" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="142.01" lengthAdjust="spacing">제1조 대부재산의 사용목적: </text>
<text x="56.69" y="271.28" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="74.81" lengthAdjust="spacing">제2조 대부기간</text>
<text x="185.95" y="271.28" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">년</text>
<text x="229.19" y="271.28" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">월</text>
<text x="272.42" y="271.28" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">일</text>
<text x="186.05" y="296.84" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">년</text>
<text x="229.28" y="296.84" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">월</text>
<text x="272.52" y="296.84" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="14.05" lengthAdjust="spacing">일(</text>
<text x="330.12" y="296.84" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="24.61" lengthAdjust="spacing">일간)</text>
<text x="56.69" y="322.4" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="90.82" lengthAdjust="spacing">제3조 대부료 연액</text>
<text x="201.96" y="322.4" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.49" lengthAdjust="spacing">원. </text>
<text x="221.46" y="322.4" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="272.73" lengthAdjust="spacing">다만, 월할 계산에 있어 1월 미만 일수는 일할 계산한다.</text>
<text x="56.69" y="347.96" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="269.42" lengthAdjust="spacing">제4조 을은 본 계약 체결과 동시에 대부료를 납부한다.</text>
<text x="56.69" y="373.52" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제5조 을은 선량한 관리자의 주의로써 대부재산의 보존책임과 사용 또는 수익의 목적에 필요한 </text>
<text x="56.69" y="390.56" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">부담을 진다. 을은 전항의 부담비용은 물론 「민법」 제203조 또는 제626조의 규정에 따른 비용 </text>
<text x="56.69" y="407.6" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="401.41" lengthAdjust="spacing">상환 청구 등 일체의 청구를 하지 못하며 사용권 이외의 권리주장을 하지 못한다.</text>
<text x="56.69" y="433.16" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제6조 을은 본 계약 기간 중 갑을 보험금 수취인으로 하여 건물대금 상당액 이상에 해당하는 화</text>
<text x="56.69" y="450.2" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">재보험계약을 체결하여야 한다. 다만, 갑이 해당 재산에 대한 보험료 또는 공제금을 미리 납부</text>
<text x="56.69" y="467.24" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="339.79" lengthAdjust="spacing">한 경우에는 「공유재산 및 물품관리법」 제4조의 규정에 따라 을은 </text>
<text x="396.48" y="467.24" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="21.76" lengthAdjust="spacing">해당</text>
<text x="418.24" y="467.24" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="120.33" lengthAdjust="spacing"> 보험료 또는 공제금을 </text>
<text x="56.69" y="484.28" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="120.01" lengthAdjust="spacing">갑에게 납부하여야 한다.</text>
<text x="56.69" y="509.84" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="418.28" lengthAdjust="spacing">제7조 을은 갑의 승인 없이 다음 각 호의 어느 하나에 해당하는 행위를 하지 못한다.</text>
<text x="67.58" y="526.88" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="168.58" lengthAdjust="spacing">1. 사용목적 또는 수익목적의 변경</text>
<text x="67.58" y="543.92" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="184.59" lengthAdjust="spacing">2. 대부재산의 전대 또는 권리의 처분</text>
<text x="67.58" y="560.96" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="179.14" lengthAdjust="spacing">3. 대부재산의 원상을 변경하는 행위</text>
<text x="67.58" y="578" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="307.1" lengthAdjust="spacing">4. 대부재산에 시설한 을의 시설물을 제3자에게 양도하는 행위</text>
<text x="56.69" y="603.56" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="49.1" lengthAdjust="spacing">제8조 ① </text>
<text x="105.79" y="603.56" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="400.42" lengthAdjust="spacing">다음 각 호의 어느 하나에 해당하는 경우에는 갑은 언제든지 을에 대부재산의 전부</text>
<text x="506.2" y="603.56" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="32.37" lengthAdjust="spacing"> 또는 </text>
<text x="56.69" y="620.6" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="176.96" lengthAdjust="spacing">일부 계약을 해제 · 해지할 수 있다.</text>
<text x="67.58" y="637.64" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="214.64" lengthAdjust="spacing">1. 공용, 공공용 또는 공익사업에 필요한 때</text>
<text x="67.68" y="654.68" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="79.34" lengthAdjust="spacing">2. 을이 계약 후</text>
<text x="174.5" y="654.68" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">년</text>
<text x="207.13" y="654.68" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="331.44" lengthAdjust="spacing">월이 경과하여도 사용목적에 착수하지 아니하거나 대부기간 만료일</text>
<text x="56.69" y="671.72" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="249.38" lengthAdjust="spacing">까지 사용목적을 달성할 수 없다고 갑이 인정할 때</text>
<text x="67.58" y="688.76" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="196.02" lengthAdjust="spacing">3. 제4조 내지 전조의 규정에 위반한 때</text>
<text x="67.58" y="705.8" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="391.71" lengthAdjust="spacing">4. 을이 한국에 주소 또는 거소가 없게 된 경우에 관리인을 신고하지 아니한 때</text>
<text x="67.58" y="722.84" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="405.76" lengthAdjust="spacing">5. 을이 체납처분 · 강제집행 또는 경매로 인하여 지상 물건의 소유권을 상실한 때</text>
<text x="67.58" y="739.88" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="380.82" lengthAdjust="spacing">6. 을이 갑으로부터 공유재산의 매수요구를 받고도 매수에 응하지 아니한 때 </text>
<text x="62.57" y="756.92" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="338.9" lengthAdjust="spacing"> 7. 그 밖에 을이 본 계약조항을 불이행하거나 또는 이에 위반한 때 </text>
<text x="56.69" y="773.96" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacingAndGlyphs"> ② 전항의 규정에 따라 해제 · 해지하는 경우에는 을에게 손해가 있을지라도 갑은 이를 배상하지 </text>
</g></g>
<g data-page="2" transform="translate(0 865.88)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="56.69" y="94.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="313.52" lengthAdjust="spacing">아니한다. 다만, 제1호의 경우에는 갑은 손실을 보상할 수 있다.</text>
<text x="62.06" y="111.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="15.77" lengthAdjust="spacingAndGlyphs">③ </text>
<text x="77.83" y="111.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="455.37" lengthAdjust="spacingAndGlyphs">제1항의 규정에 따라 해제 · 해지하는 경우의 대부료는 제3조의 규정에 따라 계산하고 과납금은</text>
<text x="56.69" y="128.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="72.31" lengthAdjust="spacing">이를 반환한다.</text>
<text x="56.69" y="154.02" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="32.99" lengthAdjust="spacing">제9조 </text>
<text x="89.68" y="154.02" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="443.38" lengthAdjust="spacing">제8조 제7호 단서의 배상액은 1개 감정평가법인의 평가액을 기준으로 갑이 결정하고 을은</text>
<text x="56.69" y="171.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">배상액에 대하여 부당하다고 판단되면 배상통지를 받은 날로부터 60일 이내에 이의신청을 할 </text>
<text x="56.69" y="188.1" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="40.62" lengthAdjust="spacing">수 있다.</text>
<text x="56.69" y="213.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.08" lengthAdjust="spacingAndGlyphs">제10조 </text>
<text x="94.77" y="213.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="15.49" lengthAdjust="spacingAndGlyphs">① </text>
<text x="110.26" y="213.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="401.85" lengthAdjust="spacingAndGlyphs">본 계약 기간 중에 을이 해제 · 해지를 요구할 때에는 1월 전에 원서를 제출하여야 한다.</text>
<text x="517.38" y="213.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="21.19" lengthAdjust="spacingAndGlyphs"> ② </text>
<text x="56.69" y="230.7" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제1항의 규정에 따라 갑이 해제 · 해지하는 경우에 대부료는 제3조의 규정에 따라 계산하고 과</text>
<text x="56.69" y="247.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">납금은 이를 반환한다. 이 경우에 해제 · 해지로 인하여 을에게 손해가 있을지라도 갑은 이를 보</text>
<text x="56.69" y="264.78" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="82.87" lengthAdjust="spacing">상하지 아니한다.</text>
<text x="56.69" y="290.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacingAndGlyphs">제11조 대부기간이 만료되거나 본 계약이 해제 · 해지된 경우에는 을은 갑이 지정하는 기한 내에 </text>
<text x="56.69" y="307.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">대부재산을 원상으로 회복하여 갑의 입회하에 반환하여야 한다. 다만, 대부 목적의 성질상 대부</text>
<text x="56.69" y="324.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">재산의 원상회복이 불필요한 경우와 사전에 갑이 원상변경을 승인한 경우에는 그러하지 아니할 </text>
<text x="56.69" y="341.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="40.62" lengthAdjust="spacing">수 있다.</text>
<text x="56.69" y="367.02" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제12조 대부기간 만료 후 을이 계속하여 대부를 받고자 하는 경우에는 기간 만료 1월 전에 다시 </text>
<text x="56.69" y="384.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="157.14" lengthAdjust="spacing">대부 신청서를 제출하여야 한다.</text>
<text x="56.69" y="409.62" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제13조 대부기간 만료 후에 을이 계속하여 대부계약을 체결하지 않고 사용할 때에는 「공유재산 </text>
<text x="56.69" y="426.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="323.11" lengthAdjust="spacing">및 물품관리법」 제81조의 규정에 따른 변상금을 부담하여야 한다.</text>
<text x="56.69" y="452.22" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">제14조 을이 본 계약에 정한 의무를 이행하지 아니하거나 의무를 위반하여 갑에게 손해를 끼친 </text>
<text x="56.69" y="469.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="189.16" lengthAdjust="spacing">경우에는 을이 그 배상의 책임을 진다.</text>
<text x="56.69" y="494.82" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.42" lengthAdjust="spacingAndGlyphs">제15조 </text>
<text x="95.11" y="494.82" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="438.03" lengthAdjust="spacingAndGlyphs">을이 본 계약 사항에 대하여 이의가 있을 때에는 쌍방 합의하에 갑이 결정한다. 본 계약이</text>
<text x="56.69" y="511.86" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="450.19" lengthAdjust="spacing">체결되었음을 증명하기 위하여 본 계약서 2통을 작성하여 기명날인하고 각각 1통씩 가진다.</text>
<text x="252.71" y="537.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">년</text>
<text x="295.94" y="537.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">월</text>
<text x="339.18" y="537.42" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">일</text>
<text x="122.03" y="562.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="49.22" lengthAdjust="spacing">대부자(갑)</text>
<text x="344.61" y="562.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="17.53" lengthAdjust="spacing">(인)</text>
