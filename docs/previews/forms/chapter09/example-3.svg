<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 1707.72" width="595.28pt" height="1707.72pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.86"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="68.2" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[예시3]</text>
<text x="149.18" y="138.39" font-size="16" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="296.9" lengthAdjust="spacing">학교급식 식재료 구매계약 특수조건 (예시)</text>
<text x="56.69" y="178.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="56.58" lengthAdjust="spacing" font-weight="bold">제1조(총칙)</text>
<text x="113.27" y="178.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="425.3" lengthAdjust="spacing"> 학교급식 식재료 구매계약 특수조건(이하 “식재료 구매계약 특수조건”이라 한다)은 </text>
<text x="56.69" y="196.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">지방자치단체 물품 구매계약 일반조건에 의하여 000학교에서 집행하는 학교급식 식재료(이하“식</text>
<text x="56.69" y="214.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">재료”라 한다) 구매계약에 관한 세부적인 사항을 규정함을 목적으로 하며, 모든 해석은 본 식재</text>
<text x="56.69" y="231.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="362.45" lengthAdjust="spacing">료 구매계약 특수조건을 먼저 해석하고 다음은 계약 해석 순위에 따른다.</text>
<text x="56.69" y="266.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="55.77" lengthAdjust="spacing" font-weight="bold">제2조(정의)</text>
<text x="112.46" y="266.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="255.42" lengthAdjust="spacing"> 이 조건에서 사용하는 용어의 정의는 다음과 같다.</text>
<text x="67.75" y="284.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.82" lengthAdjust="spacing">1. &quot;계약담당자“라 함은 전북특별자치도 공립학교회계 규칙에 따라 000학교장(관계법령에 의하</text>
<text x="56.69" y="302.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="347.71" lengthAdjust="spacing">여 직무를 대행하는 자를 포함한다. 이하“학교장”이라 한다)을 말한다.</text>
<text x="67.71" y="319.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.86" lengthAdjust="spacing">2. &quot;계약상대자&quot;라 함은 000학교(이하“학교”라 한다)와 식재료 구매계약을 체결한 자연인 또는 </text>
<text x="56.69" y="337.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="73.04" lengthAdjust="spacing">법인을 말한다.</text>
<text x="67.7" y="354.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.87" lengthAdjust="spacing">3. 이 조건에서 따로 정하는 경우를 제외하고는 지방자치단체를 당사자로 하는 계약에 관한 법</text>
<text x="56.69" y="372.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">률 시행령(이하 &quot;시행령“이라 한다), 시행규칙 및 행정안전부예규 지방자치단체 물품구매 입</text>
<text x="56.69" y="390.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">찰유의서(이하 &quot;유의서“라 한다), 행정안전부예규 지방자치단체 물품 구매계약 일반조건(이</text>
<text x="56.69" y="407.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="306.68" lengthAdjust="spacing">하“물품 구매계약 일반조건”이라 한다)에 정하는 바에 의한다.</text>
<text x="56.69" y="442.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="77.11" lengthAdjust="spacing" font-weight="bold">제3조(계약문서)</text>
<text x="67.85" y="460.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.72" lengthAdjust="spacing">① 계약문서는 계약서, 유의서, 물품 구매계약 일반조건, 식재료 구매계약 특수조건, 계약체결</text>
<text x="56.69" y="478.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">시 제출한 계약금액 산출내역서(이하“산출내역서”라 한다) 등으로 구성하며, 산출내역서 상</text>
<text x="56.69" y="495.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="255.42" lengthAdjust="spacing">의 품목별 단가는 대금의 지급시 적용 기준이 된다.</text>
<text x="67.69" y="513.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="429.99" lengthAdjust="spacing">② 유의서, 물품 구매계약 일반조건은 계약서에 첨부하지 아니하여도 당연히 적용된다.</text>
<text x="56.69" y="548.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="103.95" lengthAdjust="spacing" font-weight="bold">제4조(권리양도 제한)</text>
<text x="67.78" y="566.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.79" lengthAdjust="spacing">① 계약상대자는 학교장의 승낙 없이 본 계약으로 발생되는 권리와 의무를 제3자에게 양도할 </text>
<text x="56.69" y="583.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="41.03" lengthAdjust="spacing">수 없다.</text>
<text x="67.71" y="601.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.86" lengthAdjust="spacing">② 계약기간 중 계약상대자의 상호, 대표자 명의 등이 변경되었을 경우 이를 즉시 학교장에게 </text>
<text x="56.69" y="618.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="185.57" lengthAdjust="spacing">통보하고 필요한 절차를 거쳐야 한다.</text>
<text x="56.69" y="654.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="87.78" lengthAdjust="spacing" font-weight="bold">제5조(계약보증금)</text>
<text x="56.69" y="671.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">계약을 체결하고자 하는 자는 계약체결일까지 시행령 제51조에 따라 시행령 제37조제2항에 규정</text>
<text x="56.69" y="689.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="298.1" lengthAdjust="spacing">된 현금 또는 보증서 등으로 계약보증금을 납부하여야 한다.</text>
<text x="56.69" y="724.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="77.11" lengthAdjust="spacing" font-weight="bold">제6조(수량조절)</text>
<text x="56.69" y="742.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">학교장은 급식 학생수의 증감 등 학교의 사정에 따라 계약된 식재료의 수량을 증감 조절할 수 </text>
<text x="56.69" y="759.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">있으며, 단가는 계약시 제출한 산출내역서에 의한다. 이로 인한 계약금액은 조정된 것으로 간주</text>
<text x="56.69" y="777.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="24.86" lengthAdjust="spacing">한다.</text>
</g></g>
<g data-page="2" transform="translate(0 865.86)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="56.69" y="94.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="93.28" lengthAdjust="spacing" font-weight="bold">제7조(공급 식재료)</text>
<text x="149.97" y="94.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="212.41" lengthAdjust="spacing"> 계약상대자가 공급할 급식 식재료로 한다.</text>
<text x="56.69" y="129.58" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="77.11" lengthAdjust="spacing" font-weight="bold">제8조(납품방법)</text>
<text x="67.64" y="147.18" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.93" lengthAdjust="spacingAndGlyphs">① 계약상대자는 품질이 우수하고 안전한 양질의 식재료(검사에 필요한 서류 등을 포함한다)를 </text>
<text x="56.69" y="164.78" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">계약체결 후 학교장이“매주 단위로 제시하는 납품 요구서”에 따라 지정된 시간까지 지정된 </text>
<text x="56.69" y="182.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="351.06" lengthAdjust="spacing">장소에 정돈하여 납품해야 하며 신선도를 유지하기 위해 항상 냉동</text>
<text x="407.75" y="182.38" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif">․</text>
<text x="414.15" y="182.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="124.42" lengthAdjust="spacing">냉장차량을 이용하여야 </text>
<text x="56.69" y="199.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="158.73" lengthAdjust="spacing">하고 대면검수를 원칙으로 한다.</text>
<text x="67.69" y="217.58" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="298.1" lengthAdjust="spacing">② 건어물은 습기가 없고 건조하고 서늘한 상태로 납품한다.</text>
<text x="67.69" y="235.18" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="301.62" lengthAdjust="spacing">③ 사용용도에 따라 모양, 크기를 알맞게 작업하여 납품한다.</text>
<text x="67.69" y="252.78" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="385.55" lengthAdjust="spacing">④ 오징어, 낙지, 조갯살, 새우살 등 패류는 물(얼음)을 뺀 실량으로 측정한다.</text>
<text x="67.52" y="270.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="238.07" lengthAdjust="spacingAndGlyphs">⑤ 제1항의 규정에 의하여 납품된 식재료를 검수</text>
<text x="305.59" y="270.38" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.79" lengthAdjust="spacingAndGlyphs"> ․ </text>
<text x="322.38" y="270.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="216.19" lengthAdjust="spacingAndGlyphs">수령하기까지 학교의 책임 없는 사유로 인하</text>
<text x="56.69" y="287.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="336.49" lengthAdjust="spacing">여 발생된 식재료의 망실 ․ 파손 등은 계약상대자의 부담으로 한다.</text>
<text x="67.6" y="305.58" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.97" lengthAdjust="spacingAndGlyphs">⑥ 계약상대자는 계약체결 후 전시, 사변 또는 이에 준하는 비상사태가 발생하더라도 학교장의 </text>
<text x="56.69" y="323.18" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="276.76" lengthAdjust="spacing">별도 지시가 없는 한 식재료의 공급을 계속하여야 한다.</text>
<text x="56.69" y="358.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="120.12" lengthAdjust="spacing" font-weight="bold">제9조(위생관리 책임 등)</text>
<text x="67.79" y="375.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="353.23" lengthAdjust="spacing">① 계약상대자는 식재료의 제조, 가공, 운반 등 모든 과정에서 유해한 </text>
<text x="421.02" y="375.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="117.55" lengthAdjust="spacing">물질이 식재료에 혼입되</text>
<text x="56.69" y="393.58" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="363.94" lengthAdjust="spacing">거나 식재료가 오염되지 않도록 위생과 안전관리에 철저를 기하여야 한다.</text>
<text x="67.92" y="411.18" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.65" lengthAdjust="spacing">② 계약상대자는 기타 「식품위생법」등 관계 규정이 정하는 바에 따라 위생검사 등 식재료 공</text>
<text x="56.69" y="428.78" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">급자가 준수해야 할 사항을 성실히 이행하여 식중독 등 제반 사고를 미연에 방지하여야 하</text>
<text x="56.69" y="446.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="248.27" lengthAdjust="spacing">고, 학교장은 이와 관련된 자료를 요구할 수 있다.</text>
<text x="67.93" y="463.98" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.64" lengthAdjust="spacing">③ 계약상대자는 납품한 식재료의 결함으로 인하여 발생하는 식중독 사고 등은 물론 식재료 </text>
<text x="56.69" y="481.58" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">운반차량으로 인하여 학교 내에서 발생하는 사고 등에 대하여도 민·형사상의 모든 책임을 </text>
<text x="56.69" y="499.18" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="24.86" lengthAdjust="spacing">진다.</text>
<text x="56.69" y="534.38" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="168.85" lengthAdjust="spacing" font-weight="bold">제10조(계약상대자 일반 준수사항)</text>
</g></g>
