<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.86" width="595.28pt" height="841.86pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.86"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="64.61" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[예시2]</text>
<text x="193.89" y="144.59" font-size="16" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="207.48" lengthAdjust="spacing">학교급식소위원회 규정안 (예시)</text>
<text x="56.69" y="177.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="54.88" lengthAdjust="spacingAndGlyphs" font-weight="bold">제1조(목적)</text>
<text x="111.57" y="177.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="427" lengthAdjust="spacingAndGlyphs"> 이 규정은 초･중등교육법 시행령 제60조의2, ○○학교운영위원회 설치･운영에 관한 </text>
<text x="56.69" y="194.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">조례 제○조에 따라 ○○학교 학교운영위원회에 “학교급식소위원회”(이하‘위원회’라 한다)의 설</text>
<text x="56.69" y="212.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="292.6" lengthAdjust="spacing">치･운영에 관하여 필요한 사항을 규정함을 목적으로 한다.</text>
<text x="56.69" y="229.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="55.5" lengthAdjust="spacingAndGlyphs" font-weight="bold">제2조(기능)</text>
<text x="112.19" y="229.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="426.38" lengthAdjust="spacingAndGlyphs"> ○○학교운영위원회설치･운영에 관한 조례 제○조에 근거하여 다음 각 호의 기능을 </text>
<text x="56.69" y="247.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="46.2" lengthAdjust="spacing">수행한다.</text>
<text x="67.69" y="265.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="238.15" lengthAdjust="spacing">1. 학교급식 식재료 검수, 조리과정 등 위생점검</text>
<text x="67.69" y="282.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="298.98" lengthAdjust="spacing">2. 업체 선정방법 및 선정기준에 대한 의견제시 및 현장방문</text>
<text x="67.69" y="300.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="143.44" lengthAdjust="spacing">3. 학교급식개선에 관한 활동</text>
<text x="67.69" y="317.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="336.16" lengthAdjust="spacing">4. 기타 학교급식과 관련하여 학교운영위원회에서 위임 결정한 사항</text>
<text x="56.69" y="335.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="55.77" lengthAdjust="spacing" font-weight="bold">제3조(구성)</text>
<text x="112.46" y="335.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="320.32" lengthAdjust="spacing"> ① 위원회는 위원장･부위원장 각 1인을 포함한 ○명으로 한다.</text>
<text x="56.69" y="353.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.17" lengthAdjust="spacing">② </text>
<text x="72.86" y="353.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="447.37" lengthAdjust="spacing">위원회의 위원장은 학교운영위원회 위원이어야 하며, 학교운영위원회 위원 중에서 호선한다.</text>
<text x="56.69" y="370.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">③ 위원은 다음 각 호의 자중에서 학교운영위원장이 위촉한다. 단, 학부모위원이 과반수를 넘어</text>
<text x="56.69" y="388.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="41.03" lengthAdjust="spacing">야 한다.</text>
<text x="67.69" y="405.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="47.08" lengthAdjust="spacing">1. 교직원</text>
<text x="67.69" y="423.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="52.58" lengthAdjust="spacing">2. 학부모 </text>
<text x="67.69" y="441.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="116.6" lengthAdjust="spacing">3. 학교운영위원회 위원</text>
<text x="67.69" y="458.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="63.25" lengthAdjust="spacing">4. 학생대표 </text>
<text x="56.69" y="476.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="93.28" lengthAdjust="spacing" font-weight="bold">제4조(위원의 임기)</text>
<text x="149.97" y="476.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="379.5" lengthAdjust="spacing"> 위원회 위원의 임기는 1년으로 하며 불가피한 경우 외에는 연임할 수 없다.</text>
<text x="56.69" y="493.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="454.96" lengthAdjust="spacing">※ 불가피한 경우: 연임이 아니면 소위원회를 구성하기 어려운 경우, 학교별 특수한 여건 등</text>
<text x="56.69" y="511.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="120.12" lengthAdjust="spacing" font-weight="bold">제5조(위원장 등의 직무)</text>
<text x="176.81" y="511.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="301.62" lengthAdjust="spacing"> ① 위원장은 위원회를 대표하고, 위원회의 업무를 통할한다.</text>
<text x="56.69" y="529.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="481.88" lengthAdjust="spacing">② 부위원장은 위원장을 보좌하며, 위원장이 부득이한 사유로 직무를 수행할 수 없는 때에는 그 </text>
<text x="56.69" y="546.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="83.71" lengthAdjust="spacing">직무를 대행한다.</text>
<text x="56.69" y="564.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="71.94" lengthAdjust="spacing" font-weight="bold">제6조(회의 등)</text>
<text x="128.63" y="564.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="21.67" lengthAdjust="spacing"> ① </text>
<text x="150.3" y="564.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="386.57" lengthAdjust="spacing">회의는 정기회와 임시회로 구분하여 운영하며, 정기회의는 연2회 이상 개최한다.</text>
<text x="56.69" y="581.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.17" lengthAdjust="spacing">② </text>
<text x="72.86" y="581.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="447.83" lengthAdjust="spacing">임시회 소집은 위원회 위원장 또는 재적위원 3분의 1이상의 요구가 있을 때 위원장이 소집한다.</text>
<text x="56.69" y="599.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="16.17" lengthAdjust="spacing">③ </text>
<text x="72.86" y="599.54" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="448.14" lengthAdjust="spacing">위원회 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.</text>
<text x="56.69" y="617.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="55.77" lengthAdjust="spacing" font-weight="bold">제7조(간사)</text>
<text x="117.96" y="617.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="419.44" lengthAdjust="spacing">위원회의 사무를 처리하기 위하여 위원회에 간사1인을 두되, 간사는 영양(교)사로 한다.</text>
<text x="56.69" y="634.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="109.45" lengthAdjust="spacing" font-weight="bold">제8조(회의록 작성 등)</text>
<text x="171.64" y="634.74" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="365.33" lengthAdjust="spacing">회의록을 작성하고 회의의 내용과 결과를 학교운영위원회에 서면 보고한다.</text>
<text x="56.69" y="652.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="77.57" lengthAdjust="spacing" font-weight="bold">제9조(운영세칙)</text>
<text x="134.26" y="652.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="404.31" lengthAdjust="spacing"> 이 규정에서 규정한 이외에 위원회의 운영에 관하여 필요한 사항은 위원회의 심</text>
<text x="56.69" y="669.94" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="190.74" lengthAdjust="spacing">의를 거쳐 학교운영위원회에서 정한다.</text>
<text x="56.69" y="705.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">부</text>
<text x="83.86" y="705.14" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">칙</text>
<text x="67.69" y="740.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="48.18" lengthAdjust="spacing">본 규정은</text>
<text x="132.37" y="740.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">년</text>
<text x="159.54" y="740.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">월</text>
<text x="192.21" y="740.34" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="83.71" lengthAdjust="spacing">일부터 시행한다.</text>
</g></g>
</svg>