<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.86" width="595.28pt" height="841.86pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.86"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="68.2" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[예시1]</text>
<text x="178.39" y="149.91" font-size="16" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="238.49" lengthAdjust="spacing">학교급식소위원회 구성･운영(예시)</text>
<text x="56.69" y="191.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="37.51" lengthAdjust="spacing">○ 목적</text>
<text x="67.69" y="211.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="11.55" lengthAdjust="spacing">- </text>
<text x="79.24" y="211.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="468.97" lengthAdjust="spacing">학교운영위원회에 ‘학교급식소위원회’를 설치･운영하여 학교급식 위생･안전관리 및 질 향상 도모</text>
<text x="56.69" y="250.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="37.51" lengthAdjust="spacing">○ 구성</text>
<text x="67.69" y="270.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="322.3" lengthAdjust="spacing">- 학교운영위원회 위원 중 학교급식에 전문성 및 관심이 있는 자</text>
<text x="67.92" y="290.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.65" lengthAdjust="spacing">- 학교운영위원이 아닌 자는 학교운영위원회의 심의를 거쳐 학교운영위원장이 소위원회 위원</text>
<text x="56.69" y="310.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="48.18" lengthAdjust="spacing">으로 위촉</text>
<text x="67.65" y="329.86" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="11.51" lengthAdjust="spacingAndGlyphs">- </text>
<text x="79.15" y="329.86" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="459.42" lengthAdjust="spacingAndGlyphs">학교 구성원 중(교직원, 학부모)에서 학교급식에 소양이 있거나 전문성을 가진 자와 학생대표 </text>
<text x="56.69" y="349.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="47.7" lengthAdjust="spacing">등을 참여</text>
<text x="67.74" y="369.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="11.6" lengthAdjust="spacing">- </text>
<text x="79.34" y="369.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="459.23" lengthAdjust="spacing">학교 영양(교)사는 간사로 선임, 학교급식품 납품업체 선정기준(입찰참가자격) 등 결정에 참여</text>
<text x="56.69" y="389.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="222.59" lengthAdjust="spacing">할 수 없음【´05.12. 국가청렴위원회권고사항】</text>
<text x="67.83" y="409.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.74" lengthAdjust="spacing">- 학교급식소위원회 위원은 불가피한 경우 외에는 연임 불가능(학교급식 납품업체 선정 등의 </text>
<text x="56.69" y="428.86" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="110.55" lengthAdjust="spacing">투명성과 신뢰성 확보)</text>
<text x="78.69" y="448.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="454.96" lengthAdjust="spacing">※ 불가피한 경우: 연임이 아니면 소위원회를 구성하기 어려운 경우, 학교별 특수한 여건 등</text>
<text x="78.51" y="468.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="460.06" lengthAdjust="spacingAndGlyphs">☞ 공동조리학교에서는 비조리교와 공동으로 구성･운영(학교급식소위원회는 급식시설이 설치</text>
<text x="56.69" y="488.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="78.54" lengthAdjust="spacing">된 학교에 구성)</text>
<text x="56.69" y="527.86" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="37.51" lengthAdjust="spacing">○ 역할</text>
<text x="67.88" y="547.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="470.69" lengthAdjust="spacing">- 학교운영위원회에서 학교급식에 관하여 심의(자문)토록 요구한 사항에 대해 실무검토 후 본</text>
<text x="56.69" y="567.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="58.85" lengthAdjust="spacing">회의에 보고</text>
<text x="67.69" y="587.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="370.48" lengthAdjust="spacing">- 급식현장 점검 등 안전하고 양질의 급식을 위한 모니터링과 개선안 제시</text>
<text x="78.69" y="607.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="455.42" lengthAdjust="spacing">☞ 학교운영위원회 위원이 아닌 소위원회 위원은 학교운영위원회 본회의에서 표결권이 없음</text>
<text x="56.69" y="646.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="80.19" lengthAdjust="spacing">○ 주요활동내용</text>
<text x="67.69" y="666.46" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="231.11" lengthAdjust="spacing">- 급식운영 개선을 위한 조사활동 및 사전검토</text>
<text x="67.69" y="686.26" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="393.36" lengthAdjust="spacing">- 식재료 납품업체 점검에 참여(학교급식 점검단과 관계기관 합동점검 시 동행)</text>
<text x="67.69" y="706.06" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="345.51" lengthAdjust="spacing">- 식재료 검수, 조리과정, 배식 등에 관한 사항 모니터링 및 점검실시</text>
<text x="67.69" y="725.86" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="240.13" lengthAdjust="spacing">- 급식비 책정, 급식비 집행내역 등에 관한 검토</text>
<text x="67.69" y="745.66" font-size="11" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="332.64" lengthAdjust="spacing">- 기타 학교운영위원회에서 급식소위원회로 위임한 급식관련 사항 </text>
</g></g>
</svg>