<text x="693.45" y="130.84" font-size="24" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold" fill="#404040">서</text>
<text x="764.73" y="130.84" font-size="24" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold" fill="#404040">약</text>
