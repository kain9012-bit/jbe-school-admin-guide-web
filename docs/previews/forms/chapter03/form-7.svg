<text x="461.75" y="696.82" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="59.96" lengthAdjust="spacing" fill="#404040">(인, 서명)</text>
<text x="59.83" y="743.32" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="155.2" lengthAdjust="spacing" font-weight="bold" fill="#404040">전북특별자치도교육감</text>
<text x="222.03" y="743.32" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="27.16" lengthAdjust="spacing" font-weight="bold" fill="#404040">귀하</text>
