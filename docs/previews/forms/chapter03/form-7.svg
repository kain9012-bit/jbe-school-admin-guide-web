<text x="566.49" y="177.29" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">소</text>
<text x="649.72" y="177.29" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.64" lengthAdjust="spacing" fill="#404040">속 : </text>
<text x="566.49" y="207.69" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">직</text>
<text x="649.72" y="207.69" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.64" lengthAdjust="spacing" fill="#404040">급 : </text>
<text x="566.49" y="238.09" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">성</text>
<text x="649.72" y="238.09" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.64" lengthAdjust="spacing" fill="#404040">명 : </text>
<text x="566.49" y="268.49" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="124.75" lengthAdjust="spacing" fill="#404040">생 년 월 일 : </text>
<text x="563.9" y="320.34" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="424.93" lengthAdjust="spacing" fill="#404040">본인은 휴직함에 있어 다음 사항을 준수할 것을 서약합니다.</text>
<text x="538.56" y="366.64" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.61" lengthAdjust="spacing" fill="#404040"> 1. 지방공무원법 및 지방공무원 복무규정을 준수하여 지방공무원으로서의 </text>
<text x="563.41" y="389.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="144.33" lengthAdjust="spacing" fill="#404040">품위를 유지하겠습니다.</text>
<text x="538.56" y="411.44" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.61" lengthAdjust="spacing" fill="#404040"> 2. 휴직기간 중 6개월마다 휴직사유의 계속 여부를 기관(학교)장에게 신고 </text>
<text x="562.9" y="433.84" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="70.93" lengthAdjust="spacing" fill="#404040">하겠습니다.</text>
<text x="538.56" y="456.24" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.61" lengthAdjust="spacing" fill="#404040"> 3. 휴직기간을 준수하고, 휴직 사유와 다르게 휴직을 사용하지 않겠으며, 휴</text>
<text x="564.07" y="478.64" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="450.1" lengthAdjust="spacing" fill="#404040">직의 목적 외 사용 시 복직명령 또는 징계의결 요구 조치를 받을 수 있</text>
<text x="564.07" y="501.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="131.03" lengthAdjust="spacing" fill="#404040">음을 숙지하겠습니다.</text>
<text x="538.56" y="523.44" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="25.81" lengthAdjust="spacing" fill="#404040"> 4. </text>
<text x="564.37" y="523.44" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="449.8" lengthAdjust="spacing" fill="#404040">휴직기간이 만료되거나 휴직사유가 소멸된 경우에는 즉시 복직하겠으며, </text>
<text x="562.56" y="545.84" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="451.61" lengthAdjust="spacing" fill="#404040">30일 이내에 복직하지 않을 경우에는 관계규정에 의거 어떠한 처벌이나 </text>
<text x="562.56" y="568.24" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="156.03" lengthAdjust="spacing" fill="#404040">불이익도 감수하겠습니다.</text>
<text x="721.21" y="613.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="15.09" lengthAdjust="spacing" fill="#404040">20</text>
<text x="736.31" y="613.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="27.16" lengthAdjust="spacing" fill="#404040">○○</text>
<text x="763.47" y="613.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">.</text>
<text x="795.3" y="613.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">.</text>
<text x="827.13" y="613.04" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">.</text>
<text x="797.26" y="657.84" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="26.62" lengthAdjust="spacing" fill="#404040">성명</text>
<text x="940.49" y="657.84" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="59.96" lengthAdjust="spacing" fill="#404040">(인, 서명)</text>
<text x="538.56" y="704.34" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="155.2" lengthAdjust="spacing" font-weight="bold" fill="#404040">전북특별자치도교육감</text>
<text x="700.76" y="704.34" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="27.16" lengthAdjust="spacing" font-weight="bold" fill="#404040">귀하</text>
