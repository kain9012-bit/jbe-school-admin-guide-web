<text x="87.76" y="216.27" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">소</text>
<text x="170.99" y="216.27" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.64" lengthAdjust="spacing" fill="#404040">속 : </text>
<text x="87.76" y="246.67" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">직</text>
<text x="170.99" y="246.67" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.64" lengthAdjust="spacing" fill="#404040">급 : </text>
<text x="87.76" y="277.07" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">성</text>
<text x="170.99" y="277.07" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.64" lengthAdjust="spacing" fill="#404040">명 : </text>
<text x="87.76" y="307.47" font-size="19" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="124.75" lengthAdjust="spacing" fill="#404040">생 년 월 일 : </text>
<text x="85.16" y="359.32" font-size="16" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="424.93" lengthAdjust="spacing" fill="#404040">본인은 휴직함에 있어 다음 사항을 준수할 것을 서약합니다.</text>
<text x="59.83" y="405.62" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.6" lengthAdjust="spacing" fill="#404040"> 1. 지방공무원법 및 지방공무원 복무규정을 준수하여 지방공무원으로서의 </text>
<text x="59.83" y="428.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="144.33" lengthAdjust="spacing" fill="#404040">품위를 유지하겠습니다.</text>
<text x="59.83" y="450.42" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.6" lengthAdjust="spacing" fill="#404040"> 2. 휴직기간 중 6개월마다 휴직사유의 계속 여부를 기관(학교)장에게 신고 </text>
<text x="59.83" y="472.82" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="70.93" lengthAdjust="spacing" fill="#404040">하겠습니다.</text>
<text x="59.83" y="495.22" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.6" lengthAdjust="spacing" fill="#404040"> 3. 휴직기간을 준수하고, 휴직 사유와 다르게 휴직을 사용하지 않겠으며, </text>
<text x="59.83" y="517.62" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.6" lengthAdjust="spacing" fill="#404040">휴직의 목적 외 사용 시 복직명령 또는 징계의결 요구 조치를 받을 수 </text>
<text x="59.83" y="540.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="144.33" lengthAdjust="spacing" fill="#404040">있음을 숙지하겠습니다.</text>
<text x="59.83" y="562.42" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="25.81" lengthAdjust="spacing" fill="#404040"> 4. </text>
<text x="85.64" y="562.42" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="449.79" lengthAdjust="spacing" fill="#404040">휴직기간이 만료되거나 휴직사유가 소멸된 경우에는 즉시 복직하겠으며, </text>
<text x="59.83" y="584.82" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="475.6" lengthAdjust="spacing" fill="#404040">30일 이내에 복직하지 않을 경우에는 관계규정에 의거 어떠한 처벌이나 </text>
<text x="59.83" y="607.22" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="156.03" lengthAdjust="spacing" fill="#404040">불이익도 감수하겠습니다.</text>
<text x="242.47" y="652.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="15.09" lengthAdjust="spacing" fill="#404040">20</text>
<text x="257.57" y="652.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="27.16" lengthAdjust="spacing" fill="#404040">○○</text>
<text x="284.73" y="652.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">.</text>
<text x="316.56" y="652.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">.</text>
<text x="348.39" y="652.02" font-size="14" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" fill="#404040">.</text>
