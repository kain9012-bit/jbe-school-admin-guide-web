<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.86" width="595.28pt" height="841.86pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve"><defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.86" /></clipPath><clipPath id="pgclip1"><rect x="0" y="0" width="595.28" height="841.86" /></clipPath></defs>
<g data-page="1" transform="translate(0 0.00)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75" /><g clip-path="url(#pgclip1)">
<text x="63.2" y="105.14" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.76" lengthAdjust="spacing">[예시4-1]</text>
<text x="220.78" y="148.78" font-size="24" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="153.68" lengthAdjust="spacing">공적조서 예시(안)</text>
<line x1="202.42" y1="125.55" x2="392.85" y2="125.55" stroke="#000000" stroke-width="0.85" />
<line x1="202.42" y1="155.2" x2="392.85" y2="155.2" stroke="#000000" stroke-width="0.85" />
<line x1="202.42" y1="125.55" x2="202.42" y2="155.2" stroke="#000000" stroke-width="0.85" />
<line x1="392.85" y1="125.55" x2="392.85" y2="155.2" stroke="#000000" stroke-width="0.85" />
<text x="56.69" y="177.9" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="118.44" lengthAdjust="spacing">○ 일반직공무원(시설)</text>
<text x="79.96" y="219.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="451.28" lengthAdjust="spacing">지방시설관리○○○ 임꺽정은 15여년 간의 공직생활에서 확고한 국가관과 투철한 </text>
<text x="67.8" y="238.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="457.33" lengthAdjust="spacing">사명감으로 교육환경여건 개선에 솔선수범 하는 등 그 공적이 지대한 바, 그 실적은</text>
<text x="67.8" y="257.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.32" lengthAdjust="spacing">아래와 같습니다.</text>
<text x="67.8" y="295.88" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.03" lengthAdjust="spacing"> 1. </text>
<text x="90.83" y="295.88" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="428.72" lengthAdjust="spacing">○○고등학교, ○○중학교, ○○초등학교 등 초임 발령이래 계속 신설학교에 근무</text>
<text x="67.8" y="315.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="463.44" lengthAdjust="spacing">하면서 어려운 근무환경에서 시설분야 전반에 대한 업무보조자로 맡은 바 직무</text>
<text x="67.8" y="334.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="19.25" lengthAdjust="spacing">를 </text>
<text x="87.05" y="334.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="444.19" lengthAdjust="spacing">조사․분석하여 상급자가 의사결정을 하는데 있어서 합리적인 결정이 이루어 </text>
<text x="67.8" y="353.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="34.57" lengthAdjust="spacing">질 수 </text>
<text x="102.37" y="353.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="190.8" lengthAdjust="spacing">있도록 최선의 노력을 다하였으며, </text>
<text x="67.8" y="391.88" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.13" lengthAdjust="spacing"> 2. </text>
<text x="90.93" y="391.88" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="434.12" lengthAdjust="spacing">특히 ○○중학교 및 ○○초등학교에서는 학교 관리자 발령 전부터 발령 받아 건축,</text>
<text x="67.8" y="411.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.95" lengthAdjust="spacing">기계, 설비, 소방 등의 공사를 감독하고 미진한 사항에 대하여 학교 현장소장에게</text>
<text x="67.8" y="430.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.97" lengthAdjust="spacing">적극 건의하고, 개교 준비물품의 인계․인수를 혼자서 추진하여 관리자 발령 이후</text>
<text x="67.8" y="449.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="366.72" lengthAdjust="spacing">학교시설 인계․인수를 효율적이고 정확하게 할 수 있도록 하였으며,</text>
<text x="67.8" y="487.88" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="463.44" lengthAdjust="spacing"> 3. 매월 말 월중 업무추진계획을 수립하여 시설관리 업무를 효율적으로 추진할 수 </text>
<text x="67.8" y="507.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.97" lengthAdjust="spacing">있도록 하였으며, 특히 시설분야 중 전기․가스분야 담당자로 사용시설안전관리자</text>
<text x="67.8" y="526.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="438.35" lengthAdjust="spacing">과정, 에너지관리자인정양성교육, 승강기유지보수교육 등을 이수하여 학교</text>
<text x="506.15" y="526.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="25.09" lengthAdjust="spacing">급식</text>
<text x="67.8" y="545.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.81" lengthAdjust="spacing">업무 및 냉․난방 업무가 원활히 이루어 질 수 있도록 항상 자기개발에 최선을</text>
<text x="67.8" y="564.68" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="62.04" lengthAdjust="spacing">다하였으며,</text>
<text x="67.8" y="603.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="22.87" lengthAdjust="spacing"> 4. </text>
<text x="90.67" y="603.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="434.57" lengthAdjust="spacing">학생 및 교사들의 교육활동이 원활하게 이루어질 수 있도록 각종 학습자료를 복사</text>
<text x="67.8" y="622.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="457.11" lengthAdjust="spacing">인쇄하여 적시에 지원하고, 각종 시설관리와 물품관리에 많은 관심과 애정을 쏟아</text>
<text x="67.8" y="641.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="457.08" lengthAdjust="spacing">학생들의 안전사고를 미연에 방지하였으며, 원활한 학교 시설환경 조성에 적극적으로</text>
<text x="67.8" y="660.68" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="85.32" lengthAdjust="spacing">노력하였습니다.</text>
<text x="67.8" y="699.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="22.82" lengthAdjust="spacing"> 5. </text>
<text x="90.62" y="699.08" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="434.52" lengthAdjust="spacing">또한 가정에서는 존경받는 가장으로 직장에서는 항상 밝은 모습으로 최선을 다하는</text>
<text x="67.8" y="718.28" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="463.44" lengthAdjust="spacing">다른 사람의 수범이 되고 있어 ○○○○년도 하반기 교육행정유공 공무원으로 </text>
<text x="67.8" y="737.48" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="62.04" lengthAdjust="spacing">추천합니다.</text>
