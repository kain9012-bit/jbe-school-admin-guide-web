<text x="220.8" y="148.4" font-size="24" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="153.68" lengthAdjust="spacing">공적조서 예시(안)</text>
<line x1="202.43" y1="125.17" x2="392.86" y2="125.17" stroke="#000000" stroke-width="0.85"/>
<line x1="202.43" y1="154.82" x2="392.86" y2="154.82" stroke="#000000" stroke-width="0.85"/>
