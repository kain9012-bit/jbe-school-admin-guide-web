<line x1="392.86" y1="125.17" x2="392.86" y2="154.82" stroke="#000000" stroke-width="0.85"/>
<text x="56.69" y="177.88" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="118.44" lengthAdjust="spacing">○ 일반직공무원(시설)</text>
<text x="79.96" y="209.46" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="451.28" lengthAdjust="spacing">지방시설관리○○○ 임꺽정은 15여년 간의 공직생활에서 확고한 국가관과 투철한 </text>
<text x="67.8" y="228.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="463.44" lengthAdjust="spacing">사명감으로 교육환경여건 개선에 솔선수범 하는 등 그 공적이 지대한 바, 그 실적</text>
<text x="67.8" y="247.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">은</text>
<text x="79.32" y="247.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="97.32" lengthAdjust="spacing"> 아래와 같습니다.</text>
<text x="67.8" y="286.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.87" lengthAdjust="spacing"> 1. </text>
<text x="92.67" y="286.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="438.57" lengthAdjust="spacing">○○고등학교, ○○중학교, ○○초등학교 등 초임 발령이래 계속 신설학교에 </text>
<text x="92.44" y="305.46" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.16" lengthAdjust="spacing">근무</text>
<text x="127.53" y="305.46" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="403.71" lengthAdjust="spacing">하면서 어려운 근무환경에서 시설분야 전반에 대한 업무보조자로 맡은 </text>
<text x="92.44" y="324.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="62.93" lengthAdjust="spacing">바 직무를 </text>
<text x="155.37" y="324.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="375.87" lengthAdjust="spacing">조사․분석하여 상급자가 의사결정을 하는데 있어서 합리적인 결정</text>
<text x="92.44" y="343.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.96" lengthAdjust="spacing">이 이루어 질 수 </text>
<text x="184.4" y="343.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="190.8" lengthAdjust="spacing">있도록 최선의 노력을 다하였으며, </text>
<text x="67.8" y="382.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.88" lengthAdjust="spacing"> 2. </text>
<text x="92.68" y="382.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="438.56" lengthAdjust="spacing">특히 ○○중학교 및 ○○초등학교에서는 학교 관리자 발령 전부터 발령 받아 </text>
<text x="91.82" y="401.46" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="28.13" lengthAdjust="spacing">건축,</text>
<text x="126.58" y="401.46" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="404.66" lengthAdjust="spacing">기계, 설비, 소방 등의 공사를 감독하고 미진한 사항에 대하여 학교 현</text>
<text x="91.82" y="420.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="60.43" lengthAdjust="spacing">장소장에게</text>
<text x="158.74" y="420.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="372.5" lengthAdjust="spacing">적극 건의하고, 개교 준비물품의 인계․인수를 혼자서 추진하여 관</text>
<text x="91.82" y="439.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="84.39" lengthAdjust="spacing">리자 발령 이후</text>
<text x="176.21" y="439.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="355.03" lengthAdjust="spacing"> 학교시설 인계․인수를 효율적이고 정확하게 할 수 있도록 하</text>
<text x="91.82" y="459.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="38.76" lengthAdjust="spacing">였으며,</text>
<text x="67.8" y="497.46" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="463.44" lengthAdjust="spacing"> 3. 매월 말 월중 업무추진계획을 수립하여 시설관리 업무를 효율적으로 추진할 수 </text>
<text x="91.82" y="516.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="439.42" lengthAdjust="spacing">있도록 하였으며, 특히 시설분야 중 전기․가스분야 담당자로 사용시설안전관</text>
<text x="91.82" y="535.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.88" lengthAdjust="spacing">리자</text>
<text x="115.7" y="535.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="415.54" lengthAdjust="spacing"> 과정, 에너지관리자인정양성교육, 승강기유지보수교육 등을 이수하여 학</text>
<text x="91.82" y="555.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">교</text>
<text x="104.07" y="555.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.01" lengthAdjust="spacing">급식</text>
<text x="128.09" y="555.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="403.15" lengthAdjust="spacing">업무 및 냉․난방 업무가 원활히 이루어 질 수 있도록 항상 자기개발에 </text>
<text x="91.82" y="574.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="34.57" lengthAdjust="spacing">최선을</text>
<text x="132.45" y="574.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="62.04" lengthAdjust="spacing">다하였으며,</text>
<text x="67.8" y="612.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.39" lengthAdjust="spacing"> 4. </text>
<text x="92.19" y="612.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="439.05" lengthAdjust="spacing">학생 및 교사들의 교육활동이 원활하게 이루어질 수 있도록 각종 학습자료를 </text>
<text x="92.42" y="631.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.39" lengthAdjust="spacing">복사</text>
<text x="123.23" y="631.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="408.01" lengthAdjust="spacing">인쇄하여 적시에 지원하고, 각종 시설관리와 물품관리에 많은 관심과 애</text>
<text x="92.42" y="651.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="57.12" lengthAdjust="spacing">정을 쏟아</text>
<text x="156.19" y="651.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="375.05" lengthAdjust="spacing">학생들의 안전사고를 미연에 방지하였으며, 원활한 학교 시설환경 </text>
<text x="92.42" y="670.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.19" lengthAdjust="spacing">조성에 적극적으로</text>
<text x="189.49" y="670.26" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="85.32" lengthAdjust="spacing">노력하였습니다.</text>
<text x="67.8" y="708.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="24.32" lengthAdjust="spacing"> 5. </text>
<text x="92.12" y="708.66" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="439.12" lengthAdjust="spacing">또한 가정에서는 존경받는 가장으로 직장에서는 항상 밝은 모습으로 최선을 다</text>
<text x="91.82" y="727.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="22.85" lengthAdjust="spacing">하는</text>
<text x="114.67" y="727.86" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="416.57" lengthAdjust="spacing"> 다른 사람의 수범이 되고 있어 ○○○○년도 하반기 교육행정유공 공무원</text>
<text x="91.82" y="747.06" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="91.32" lengthAdjust="spacing">으로 추천합니다.</text>
