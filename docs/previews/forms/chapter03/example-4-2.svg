<text x="63.21" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.76" lengthAdjust="spacing">[예시4-2]</text>
<text x="220.8" y="147.02" font-size="24" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="153.68" lengthAdjust="spacing">공적조서 예시(안)</text>
<line x1="202.43" y1="123.79" x2="392.86" y2="123.79" stroke="#000000" stroke-width="0.85"/>
<line x1="202.43" y1="153.44" x2="392.86" y2="153.44" stroke="#000000" stroke-width="0.85"/>
<line x1="202.43" y1="123.79" x2="202.43" y2="153.44" stroke="#000000" stroke-width="0.85"/>
<line x1="392.86" y1="123.79" x2="392.86" y2="153.44" stroke="#000000" stroke-width="0.85"/>
<text x="56.69" y="176.5" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="141.72" lengthAdjust="spacing">○ 일반직공무원(사무운영)</text>
<text x="95.94" y="206.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="428.13" lengthAdjust="spacing">지방사무운영○○○ 백두산은 13여년 간의 공직생활에서 확고한 국가관과 투</text>
<text x="82.94" y="228.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.15" lengthAdjust="spacing">철한</text>
<text x="112.38" y="228.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="411.69" lengthAdjust="spacing">사명감으로 어려운 근무환경에서도 능동적이고 창의적인 자세로 맡은 바 </text>
<text x="82.94" y="249.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.07" lengthAdjust="spacing">직무를</text>
<text x="126.45" y="249.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="397.62" lengthAdjust="spacing">충실하게 수행함으로써 전북교육 발전에 기여함은 물론 청렴․성실한 </text>
<text x="82.94" y="271.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="63.56" lengthAdjust="spacing">근무 자세로</text>
<text x="146.5" y="271.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="276.84" lengthAdjust="spacing"> 타의 귀감이 되는 바, 그 실적은 아래와 같습니다.</text>
<text x="82.94" y="314.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">1</text>
<text x="90.24" y="314.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="433.83" lengthAdjust="spacing">. ○○교육청, ○○초등학교, ○○초등학교, ○○초등학교, ○○초등학교 등</text>
<text x="101.56" y="336.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">과</text>
<text x="120.08" y="336.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="403.99" lengthAdjust="spacing">대학교와 신설학교에 근무하면서 항상 밝은 얼굴로 민원인에게 응대하여 </text>
<text x="101.56" y="357.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="25.57" lengthAdjust="spacing">교직</text>
<text x="127.13" y="357.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">원</text>
<text x="145.82" y="357.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="378.25" lengthAdjust="spacing">및 민원인으로부터 친근한 기관으로서 친절하고 편안한 공직자상을 </text>
<text x="101.56" y="379.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="61.46" lengthAdjust="spacing">조성하였으며</text>
<text x="163.02" y="379.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">,</text>
<text x="82.94" y="422.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="18.11" lengthAdjust="spacing">2. </text>
<text x="101.05" y="422.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="423.02" lengthAdjust="spacing">○○지역 학교 중 초기에 CMS를 도입하여 스쿨뱅킹 납부제도로 학부형이 불</text>
<text x="101.41" y="444.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="36.97" lengthAdjust="spacing">필요한</text>
<text x="145.08" y="444.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="378.99" lengthAdjust="spacing">통장을 개설하거나 학교에 수납금액을 무통장입금하여 발생하는 수</text>
<text x="101.41" y="465.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="90.05" lengthAdjust="spacing">수료를 부담하지</text>
<text x="198.25" y="465.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="325.82" lengthAdjust="spacing">않도록 수요자 중심의 행정을 구현하는데 앞장을 서 학부</text>
<text x="101.41" y="487.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="119.41" lengthAdjust="spacing">형들로부터 개선된 행정</text>
<text x="220.82" y="487.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="214.08" lengthAdjust="spacing">서비스를 제공할 수 있도록 노력하였고,</text>
<text x="82.94" y="525.3" font-size="10" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="12.29" lengthAdjust="spacingAndGlyphs">3. </text>
<text x="95.23" y="525.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="372.99" lengthAdjust="spacingAndGlyphs">매년 초 교직원 회의를 통해 교직원 복지제도에 대한 안내문을 작성 ․설명함</text>
<text x="468.22" y="525.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="28.82" lengthAdjust="spacingAndGlyphs">으로써</text>
<text x="497.03" y="525.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="27.04" lengthAdjust="spacingAndGlyphs">, 교직</text>
<text x="98.56" y="543.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="319.98" lengthAdjust="spacingAndGlyphs">원이 적정한 시기에 혜택을 받을 수 있도록 지원하고, 직원 경조사</text>
<text x="424.1" y="543.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">시</text>
<text x="438.96" y="543.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="85.11" lengthAdjust="spacingAndGlyphs">먼저 해당 교직원에</text>
<text x="98.56" y="561.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="282.92" lengthAdjust="spacingAndGlyphs">게 수혜사항을 알려주고 구비서류 내용을 알려줘 먼저 다가가는</text>
<text x="381.48" y="561.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="27.22" lengthAdjust="spacingAndGlyphs"> 행정</text>
<text x="408.7" y="561.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">을</text>
<text x="420.1" y="561.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="103.97" lengthAdjust="spacingAndGlyphs"> 실천하여 교직원으</text>
<text x="98.56" y="579.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="132.24" lengthAdjust="spacing">로부터 칭찬이 자자하며,</text>
<text x="82.94" y="620.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="17.38" lengthAdjust="spacing">4. </text>
<text x="100.32" y="620.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="423.75" lengthAdjust="spacing">소모품 등의 구입 시에도 사전 조사를 통한 수요예측을 철저히 하여 불필요</text>
<text x="101.15" y="642.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">한</text>
<text x="120.54" y="642.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="403.53" lengthAdjust="spacing">소모품의 구입을 막고, 학년별로 혜택이 고르게 돌아갈 수 있도록 배려하</text>
<text x="101.15" y="663.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="45.86" lengthAdjust="spacing">였습니다.</text>
<text x="82.94" y="707" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="441.13" lengthAdjust="spacing">5. 또한 가정에서는 자녀양육에 성실하고 내조를 잘하는 어머니이자 아내이며 </text>
<text x="102.43" y="728.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="421.64" lengthAdjust="spacing">직장에서도 항상 밝은 모습으로 행동하여 다른 사람의 모범이 되고 있어 ○</text>
<text x="102.43" y="750.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="31.78" lengthAdjust="spacing">○년도</text>
<text x="134.21" y="750.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="272.28" lengthAdjust="spacing"> 하반기 교육행정발전 유공공무원으로 추천합니다.</text>
