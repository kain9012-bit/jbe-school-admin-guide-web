<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.86" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="63.2" y="102.3" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="50.76" lengthAdjust="spacing">[예시4-2]</text>
<text x="220.78" y="147.38" font-size="24" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="153.68" lengthAdjust="spacing">공적조서 예시(안)</text>
<line x1="202.42" y1="124.15" x2="392.85" y2="124.15" stroke="#000000" stroke-width="0.85"/>
<line x1="202.42" y1="153.8" x2="392.85" y2="153.8" stroke="#000000" stroke-width="0.85"/>
<line x1="202.42" y1="124.15" x2="202.42" y2="153.8" stroke="#000000" stroke-width="0.85"/>
<line x1="392.85" y1="124.15" x2="392.85" y2="153.8" stroke="#000000" stroke-width="0.85"/>
<text x="56.69" y="176.5" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="141.72" lengthAdjust="spacing">○ 일반직공무원(사무운영)</text>
<text x="95.1" y="221" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="422.88" lengthAdjust="spacing">지방사무운영○○○ 백두산은 13여년 간의 공직생활에서 확고한 국가관과 투철한</text>
<text x="82.94" y="242.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="435.02" lengthAdjust="spacing">사명감으로 어려운 근무환경에서도 능동적이고 창의적인 자세로 맡은 바 직무를</text>
<text x="82.94" y="264.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="441.12" lengthAdjust="spacing">충실하게 수행함으로써 전북교육 발전에 기여함은 물론 청렴․성실한 근무 자세</text>
<text x="82.94" y="285.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">로</text>
<text x="94.46" y="285.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="276.84" lengthAdjust="spacing"> 타의 귀감이 되는 바, 그 실적은 아래와 같습니다.</text>
<text x="82.94" y="329" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">1</text>
<text x="89.94" y="329" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="415.97" lengthAdjust="spacing">. ○○교육청, ○○초등학교, ○○초등학교, ○○초등학교, ○○초등학교 등</text>
<text x="505.91" y="329" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">과</text>
<text x="82.94" y="350.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="423.96" lengthAdjust="spacing">대학교와 신설학교에 근무하면서 항상 밝은 얼굴로 민원인에게 응대하여 교직</text>
<text x="506.9" y="350.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">원</text>
<text x="82.94" y="372.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="385.23" lengthAdjust="spacing">및 민원인으로부터 친근한 기관으로서 친절하고 편안한 공직자상을 조성하였으며</text>
<text x="468.17" y="372.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">,</text>
<text x="82.94" y="415.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.54" lengthAdjust="spacing">2. </text>
<text x="99.48" y="415.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="418.72" lengthAdjust="spacing">○○지역 학교 중 초기에 CMS를 도입하여 스쿨뱅킹 납부제도로 학부형이 불필요한</text>
<text x="82.94" y="437" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="434.74" lengthAdjust="spacing">통장을 개설하거나 학교에 수납금액을 무통장입금하여 발생하는 수수료를 부담하지</text>
<text x="82.94" y="458.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="441.12" lengthAdjust="spacing">않도록 수요자 중심의 행정을 구현하는데 앞장을 서 학부형들로부터 개선된 행정</text>
<text x="82.94" y="480.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="214.08" lengthAdjust="spacing">서비스를 제공할 수 있도록 노력하였고,</text>
<text x="82.94" y="519.8" font-size="10" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="14.07" lengthAdjust="spacing">3. </text>
<text x="97.01" y="519.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="427.05" lengthAdjust="spacing">매년 초 교직원 회의를 통해 교직원 복지제도에 대한 안내문을 작성 ․설명함</text>
<text x="82.94" y="541.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="34.46" lengthAdjust="spacing">으로써</text>
<text x="117.4" y="541.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="384.2" lengthAdjust="spacing">, 교직원이 적정한 시기에 혜택을 받을 수 있도록 지원하고, 직원 경조사</text>
<text x="507.72" y="541.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">시</text>
<text x="82.94" y="563" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="393.62" lengthAdjust="spacing">먼저 해당 교직원에게 수혜사항을 알려주고 구비서류 내용을 알려줘 먼저 다가가는</text>
<text x="476.56" y="563" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="29.02" lengthAdjust="spacing"> 행정</text>
<text x="505.58" y="563" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">을</text>
<text x="82.94" y="584.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="231.36" lengthAdjust="spacing">실천하여 교직원으로부터 칭찬이 자자하며,</text>
<text x="82.94" y="627.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="16.68" lengthAdjust="spacing">4. </text>
<text x="99.62" y="627.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="418.29" lengthAdjust="spacing">소모품 등의 구입 시에도 사전 조사를 통한 수요예측을 철저히 하여 불필요한</text>
<text x="82.94" y="649.4" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="405.68" lengthAdjust="spacing">소모품의 구입을 막고, 학년별로 혜택이 고르게 돌아갈 수 있도록 배려하였습니다.</text>
<text x="82.94" y="692.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="441.12" lengthAdjust="spacing">5. 또한 가정에서는 자녀양육에 성실하고 내조를 잘하는 어머니이자 아내이며 </text>
<text x="82.94" y="714.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="434.67" lengthAdjust="spacing">직장에서도 항상 밝은 모습으로 행동하여 다른 사람의 모범이 되고 있어 ○○년도</text>
<text x="82.94" y="735.8" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="266.28" lengthAdjust="spacing">하반기 교육행정발전 유공공무원으로 추천합니다.</text>
