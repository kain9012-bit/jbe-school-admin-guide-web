<text x="56.69" y="178.3" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif">○</text>
<text x="68.33" y="178.3" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="130.08" lengthAdjust="spacing"> 일반직공무원(교육행정)</text>
<text x="80.27" y="212.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="169.5" lengthAdjust="spacing">지방교육행정○○○ 홍길동은 </text>
<text x="249.78" y="212.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="193.18" lengthAdjust="spacing">2000년 1월 공직생활을 시작하여</text>
<text x="442.96" y="212.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="84.94" lengthAdjust="spacing"> 청렴한 자세로</text>
<text x="67.94" y="231.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.05" lengthAdjust="spacing">맡은 바 직무를 충실히 수행하였으며 2020.1.1일자 본교에 근무하면서 ○○학교</text>
<text x="523.99" y="231.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="10.07" lengthAdjust="spacing">, </text>
<text x="67.94" y="250.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="466.12" lengthAdjust="spacing">○○운영 등 주요시책업무와 ○○연구학교, ○○학교 등 교육사업의 효율화에 기여</text>
<text x="67.94" y="269.97" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="466.12" lengthAdjust="spacing">하였고 성실한 근무자세로 교육행정발전에 앞장서 온 우수공무원으로, 그 주요 공적</text>
<text x="67.94" y="289.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">은</text>
<text x="79.46" y="289.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="97.32" lengthAdjust="spacing"> 다음과 같습니다.</text>
<text x="71.94" y="344.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="265.44" lengthAdjust="spacing" font-weight="bold">1. ○○학교, ○○○운영 학교 운영지원의 효율화</text>
<text x="90.67" y="362.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="444.39" lengthAdjust="spacing">전북특별자치도교육청 주요시책인 2000년 ○○학교(2019. 3. 1. - 2021. 2. 28.) </text>
<text x="90.67" y="380.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="59.63" lengthAdjust="spacing">운영지원금</text>
<text x="156.64" y="380.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="378.42" lengthAdjust="spacing">○○○원, ○○○제(2003. 3. 1 - 2004. 2. 28.) ○○○원 및 ○○○</text>
<text x="90.67" y="398.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.9" lengthAdjust="spacing">운영학교</text>
<text x="137.57" y="398.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="397.49" lengthAdjust="spacing">(2017. 3. 1 - 2018. 2.28) ○천○백여만 원 등의 사업비 편성 및 집행의 </text>
<text x="90.67" y="416.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="46.34" lengthAdjust="spacing">효율화를</text>
<text x="137.01" y="416.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="398.05" lengthAdjust="spacing"> 도모하였으며 제반 연구 시범학교 운영의 효과적 지원으로 교육력 제</text>
<text x="90.67" y="434.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="120.6" lengthAdjust="spacing">고에 크게 기여하였음.</text>
<text x="71.94" y="470.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="243.96" lengthAdjust="spacing" font-weight="bold">2. ○○○연구학교를 통한 ○○업무경감 실현</text>
<text x="90.67" y="488.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="444.39" lengthAdjust="spacing">2000. 2. 1일자 ○○연구학교 지정으로 합리적인 업무모델 도출을 위해 교직원 </text>
<text x="90.67" y="506.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="444.39" lengthAdjust="spacing">상호협의를 통한 ○○업무 분산 및 ○○업무 경감팀 구성 등 ○○업무 효율화 </text>
<text x="90.67" y="524.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="430.32" lengthAdjust="spacing">추진으로 ○○의 교육행정 및 교육과정 운영 전담여건 조성에 적극 노력하였음.</text>
<text x="71.94" y="560.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="209.4" lengthAdjust="spacing" font-weight="bold">3. 학교 교육여건 개선 및 재정 효율화</text>
<text x="90.09" y="578.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="438.9" lengthAdjust="spacing">2000 ○○○지원 학교선정에 따른 사업비 편성 및 ○○실 설치 등 교육여건개선과</text>
<text x="71.94" y="596.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="456.73" lengthAdjust="spacing">각종세부 프로그램운영 및 교육사업비 집행에 따른 예산절감 노력으로 행정의</text>
<text x="71.94" y="614.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="296.52" lengthAdjust="spacing">투명성․효율성 확보를 위해 적극 노력한 우수공무원임.</text>
<text x="71.94" y="650.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="168.12" lengthAdjust="spacing" font-weight="bold">4. 공사생활이 모범적인 공무원</text>
<text x="86.69" y="668.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="441.28" lengthAdjust="spacing">항상 남을 배려하는 자세와 구성원 상호간 원활한 소통으로 업무의 효율성을 높였으며</text>
<text x="86.69" y="687.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="447.37" lengthAdjust="spacing">겸손하고 능동적이며 우수한 전문지식으로 학교 및 교육행정 발전에 크게 이바지</text>
<text x="86.69" y="706.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="447.37" lengthAdjust="spacing">하고 있고 사생활에 있어서도 성실하며 근검, 절약을 실천하는 모범적인 공무원</text>
<text x="86.69" y="725.97" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="336.48" lengthAdjust="spacing">으로 ○○○○년도 하반기 ○○○ 유공공무원으로 추천합니다.</text>
