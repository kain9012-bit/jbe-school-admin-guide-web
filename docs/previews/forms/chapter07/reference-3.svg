<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.88" width="595.28pt" height="841.88pt" font-family="'HCR Batang','함초롬바탕','Hancom Batang',AppleMyungjo,'Noto Serif CJK KR',serif" xml:space="preserve">
<defs><clipPath id="pgclip0"><rect x="0" y="0" width="595.28" height="841.88"/></clipPath></defs>
<g data-page="1" transform="translate(0 0)"><rect width="595.28" height="841.88" fill="white" stroke="#c9c7c4" stroke-width="0.75"/><g clip-path="url(#pgclip0)">
<text x="535.75" y="134.99" font-size="20" font-family="'HY헤드라인M','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="214" lengthAdjust="spacing">휴직자 기여금납부 안내</text>
<text x="63.2" y="135.26" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[참고3]</text>
<line x1="177.79" y1="147.79" x2="417.49" y2="148.79" stroke="#000000" stroke-width="12.05"/>
<text x="56.69" y="172.24" font-size="13" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="182.33" lengthAdjust="spacing" font-weight="bold">□ 휴직자 당월기여금 납부 여부</text>
<text x="56.69" y="192.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="309.28" lengthAdjust="spacing"> ○ 본인이 납부를 원하는 경우: 매월 당월기여금 개별 납부</text>
<text x="56.69" y="211.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="459.08" lengthAdjust="spacing"> ○ 납부를 원하지 않은 경우: 복직하여 매월 당월기여금과 같은 금액의 소급기여금 납부</text>
<text x="56.69" y="230.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="405.5" lengthAdjust="spacing"> ○ 휴직자가 발생한 경우 휴직중에도 기여금을 납부할 수 있음을 반드시 안내</text>
<text x="68.09" y="249.79" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="452.81" lengthAdjust="spacing">※ 육아휴직수당을 수령한 공무원이 기여금납부를 원할 경우 매월 급여에서 기여금 공제</text>
<text x="56.69" y="281.84" font-size="13" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="121.8" lengthAdjust="spacing" font-weight="bold">□ 현재 휴직 중인 자</text>
<text x="56.69" y="304.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.24" lengthAdjust="spacing"> ○ </text>
<text x="79.93" y="304.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="458.64" lengthAdjust="spacing">지금으로부터 향후의 휴직기간에 대하여만 기여금을 납부할 수 있고, 이미 지나간 휴직</text>
<text x="56.69" y="323.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="221.84" lengthAdjust="spacing">기간에 대하여는 복직하여 소급기여금 납부</text>
<text x="56.69" y="355.64" font-size="13" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="138.32" lengthAdjust="spacing" font-weight="bold">□ 기여금 개별납부 방법</text>
<text x="56.69" y="375.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="414.5" lengthAdjust="spacing"> ○ 인터넷 뱅킹: 공단 기여금납부계좌에 인터넷뱅킹을 통하여 기여금 개별 납부</text>
<text x="56.69" y="394.79" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="364.57" lengthAdjust="spacing"> ○ 무통장 입금: 은행을 방문하여 공단 기여금납부계좌에 무통장 입금</text>
<text x="68.48" y="413.99" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">※</text>
<text x="83.35" y="413.99" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="443.43" lengthAdjust="spacing">기여금납부계좌 및 입금방법: 공단누리집 → 서식자료실 → 연금서식 → 기여금납부서</text>
<text x="56.69" y="433.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="68.29" lengthAdjust="spacing">(개인용) 참조</text>
<text x="56.69" y="465.24" font-size="13" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="138.32" lengthAdjust="spacing" font-weight="bold">□ 매월 납부할 기여금액</text>
<text x="56.69" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.04" lengthAdjust="spacing"> ○ </text>
<text x="79.73" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="194.16" lengthAdjust="spacing">본인에 대한 당월기여금은 공단누리집 </text>
<text x="273.9" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="284.43" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="64.83" lengthAdjust="spacing"> 내연금보기 </text>
<text x="349.26" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="359.8" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="64.83" lengthAdjust="spacing"> 재직자정보 </text>
<text x="424.63" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="435.16" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="75.58" lengthAdjust="spacing"> 현재 기여금액</text>
<text x="510.74" y="485.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="21.98" lengthAdjust="spacing">에서</text>
<text x="56.69" y="504.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="49.93" lengthAdjust="spacing">확인 가능</text>
<text x="56.69" y="536.44" font-size="13" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="234.53" lengthAdjust="spacing" font-weight="bold">□ 휴직자가 복직한 경우 소급기여금 징수</text>
<text x="56.69" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.14" lengthAdjust="spacing"> ○ </text>
<text x="79.83" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="61.51" lengthAdjust="spacing">공단누리집 </text>
<text x="141.33" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="152.26" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="67.25" lengthAdjust="spacing"> 연금담당자 </text>
<text x="219.51" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="230.44" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="56.1" lengthAdjust="spacing"> 징수관리 </text>
<text x="286.55" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="297.47" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="67.25" lengthAdjust="spacing"> 재직자관리 </text>
<text x="364.73" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="375.66" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="84.73" lengthAdjust="spacing"> 입휴/감축관리 </text>
<text x="460.39" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">→</text>
<text x="471.32" y="556.39" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="67.25" lengthAdjust="spacing"> 개인별 감축</text>
<text x="56.69" y="575.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="27.52" lengthAdjust="spacing">기간 </text>
<text x="84.21" y="575.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="416.54" lengthAdjust="spacing">조회에서 소급기여금 납부기간 조회, 기관 급여시스템 소급기여금 납부기간에 반영</text>
<text x="56.69" y="607.64" font-size="13" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="66.07" lengthAdjust="spacing" font-weight="bold">□ 유의사항</text>
<text x="56.69" y="627.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="22.84" lengthAdjust="spacing"> ○ </text>
<text x="79.53" y="627.59" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="453.24" lengthAdjust="spacing">휴직자의 경우에 일부 미납기여금을 추징하게 되면 공단전산에서 휴직자가 당월기여금을</text>
<text x="56.69" y="646.79" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">납부하는 자로 인식하여 당월기여금 1개월분을 미납으로 표시되므로 미납기여금 추징시</text>
<text x="56.69" y="665.99" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="49.93" lengthAdjust="spacing">주의 요망</text>
<text x="68.09" y="685.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="11.73" lengthAdjust="spacing">- </text>
<text x="79.82" y="685.19" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="442.62" lengthAdjust="spacing">휴직자 미납기여금 징수 시에는 당월기여금과 함께 징수하여야 미납기여금이 발생하지 않음</text>
<text x="56.69" y="712.79" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="464.24" lengthAdjust="spacing"> ○ 기여금 징수율이 2020년도 9%를 납부하도록 하고 있고, 매년 기준소득월액 기준이</text>
<text x="56.69" y="731.99" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="377.34" lengthAdjust="spacing">올라가므로 휴직중이라도 기여금을 납부하는 것이 유리하다고 볼 수 있음</text>
</g></g>
</svg>