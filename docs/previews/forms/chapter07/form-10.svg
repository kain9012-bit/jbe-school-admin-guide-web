<text x="56.69" y="131.69" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.9" lengthAdjust="spacing">민사집행법 제248조제1항 및 제297조의 규정에 의하여 OO교육지원청 OO중학교에 재직</text>
