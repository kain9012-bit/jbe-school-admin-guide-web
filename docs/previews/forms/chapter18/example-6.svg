<text x="110.94" y="287.69" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="384.74" lengthAdjust="spacing">BC카드, KB국민카드, NH농협카드, 신한카드, 롯데카드, 삼성카드, 현대카드, 하나카드</text>
<text x="59.5" y="308.38" font-size="14" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="36.12" lengthAdjust="spacing">(경유)</text>
