<line x1="56.69" y1="337.7" x2="552.77" y2="337.74" stroke="#000000" stroke-width="0.91"/>
<text x="56.69" y="358.14" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="31.46" lengthAdjust="spacing">관련: </text>
<text x="88.15" y="358.14" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="405.73" lengthAdjust="spacing">○○초등학교와 신용카드사 8개사 간의 교육비 신용카드 자동납부 가맹점 계약</text>
<text x="56.69" y="377.34" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="424.42" lengthAdjust="spacing">2. 다음과 같이 가맹점 계약에 필요한 조치를 요청하니 협조하여 주시기 바랍니다.</text>
<text x="68.09" y="396.54" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="70.34" lengthAdjust="spacing">가. 학교 정보</text>
<text x="79.49" y="415.74" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="273.49" lengthAdjust="spacing">1) 학교명: ○○초등학교(20○○년 3월 1일 개교예정)</text>
<text x="79.49" y="434.94" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="203.38" lengthAdjust="spacing">2) 사업자번호: ○○○-○○-○○○○○</text>
<text x="79.49" y="454.14" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="41.38" lengthAdjust="spacing">3) 주소:</text>
<text x="79.49" y="473.34" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="74.56" lengthAdjust="spacing">4) 학교이메일:</text>
<text x="68.09" y="492.54" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="109.21" lengthAdjust="spacing">나. 가맹점 개설 요청</text>
<text x="79.49" y="511.74" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="188.44" lengthAdjust="spacing">1) 학교회계 용도의 1개 가맹점 개설</text>
<text x="79.49" y="530.94" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="87.67" lengthAdjust="spacing">2) 계좌사본 첨부</text>
<text x="68.09" y="550.14" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="20.41" lengthAdjust="spacing">다. </text>
<text x="88.5" y="550.14" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="434.39" lengthAdjust="spacing">본 공문으로 온라인 거래를 위한 아래의 특약과 서류를 갈음 및 대체해 줄 것을 요청</text>
<text x="79.49" y="569.34" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="444.85" lengthAdjust="spacing">1) 갈음 대상 특약: 수기매출특약, EDI매입특약, 무승인매입특약, 부분취소/분할매입특약</text>
<text x="79.49" y="588.54" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="222.87" lengthAdjust="spacing">2) 갈음 대상 서류: IC단말기, 미설치사유서</text>
<text x="56.69" y="626.94" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="23.28" lengthAdjust="spacing">붙임</text>
<text x="91.97" y="626.94" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="321" lengthAdjust="spacing">1. 가맹점 가입 신청서 및 개인정보 동의서 8부.(별도 첨부)</text>
<text x="92.69" y="646.14" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="233.16" lengthAdjust="spacing">2. 학교회계 결제계좌 사본 8부.(별도 첨부)</text>
<text x="92.69" y="665.34" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="192.24" lengthAdjust="spacing">3. 고유번호증 사본 8부.(별도 첨부)</text>
<text x="92.69" y="684.54" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="209.88" lengthAdjust="spacing">4. 대표자 신분증 사본 3부.(별도 첨부)</text>
<text x="314.57" y="684.54" font-size="12" font-family="'Gulim','굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="15.48" lengthAdjust="spacing">끝.</text>
