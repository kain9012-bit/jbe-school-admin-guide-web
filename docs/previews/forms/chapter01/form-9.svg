<text x="142.14" y="159.81" font-size="20" font-family="'한양신명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="311" lengthAdjust="spacing" font-weight="bold">행정정보공동이용 접근권한 신청서</text>
<text x="368.69" y="205.83" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="38.76" lengthAdjust="spacing" font-weight="bold">신청일:</text>
<text x="431.45" y="205.83" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="13.2" lengthAdjust="spacing" font-weight="bold">20</text>
<text x="462.65" y="205.83" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold">년</text>
<text x="492.29" y="205.83" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold">월</text>
<text x="521.93" y="205.83" font-size="12" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" font-weight="bold">일</text>
<text x="60.13" y="235.57" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="42.8" lengthAdjust="spacing" font-weight="bold">1. 신청인</text>
<text x="177.39" y="235.57" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.4" lengthAdjust="spacing" font-weight="bold">부서</text>
<text x="302.72" y="227.57" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.4" lengthAdjust="spacing" font-weight="bold">직급</text>
<text x="299.52" y="243.57" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="25.8" lengthAdjust="spacing" font-weight="bold">(직위)</text>
<text x="428.04" y="235.57" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="19.4" lengthAdjust="spacing" font-weight="bold">성명</text>
<text x="60.13" y="267.71" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="57.5" lengthAdjust="spacing" font-weight="bold">2. 담당 업무</text>
<text x="60.13" y="298.09" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="62.2" lengthAdjust="spacing" font-weight="bold">3. 이용사무명</text>
<text x="60.13" y="351.16" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="96.3" lengthAdjust="spacing" font-weight="bold">4. 공동이용 행정정보</text>
<text x="75.13" y="367.16" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="45.2" lengthAdjust="spacing" font-weight="bold">(구비서류)</text>
<text x="166.78" y="321.67" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="10.44" lengthAdjust="spacing" font-weight="bold">1.</text>
<text x="166.78" y="348.07" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="10.44" lengthAdjust="spacing" font-weight="bold">2.</text>
<text x="166.78" y="374.47" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="10.44" lengthAdjust="spacing" font-weight="bold">3.</text>
<text x="166.78" y="400.87" font-size="12" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="10.44" lengthAdjust="spacing" font-weight="bold">4.</text>
<text x="60.13" y="419.25" font-size="10" font-family="'HCR Batang','함초롬바탕','한컴바탕','HCR Batang','Batang','Noto Serif KR',serif" textLength="33.1" lengthAdjust="spacing" font-weight="bold">5. 비고</text>
<text x="238.86" y="449.69" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="115.57" lengthAdjust="spacing" font-weight="bold" text-decoration="underline">&lt; 신청시 유의사항&gt;</text>
<text x="63.13" y="475.99" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="13.55" lengthAdjust="spacingAndGlyphs">※ </text>
<text x="76.68" y="475.99" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="453.47" lengthAdjust="spacingAndGlyphs">본인의 업무를 행정정보공동이용을 통하여 처리하고자 하는 경우에만 접근권한을 신청하여</text>
<text x="78.75" y="491.39" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="445.98" lengthAdjust="spacingAndGlyphs">야 하며, 소관업무 이외의 업무처리를 위해 접근권한을 신청하거나, 업무 이외의 용도로</text>
<text x="78.75" y="506.79" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="195.91" lengthAdjust="spacing">행정정보를 공동이용하여서는 안됩니다.</text>
<text x="258.77" y="536.39" font-size="13" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="77.74" lengthAdjust="spacing" font-weight="bold" text-decoration="underline">&lt; 기재요령 &gt;</text>
<text x="58.13" y="563.44" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="47.08" lengthAdjust="spacing">1. 신청인</text>
<text x="74.63" y="577.19" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="267.63" lengthAdjust="spacing">신청인의 소속부서, 직급, 직위 및 성명을 기재합니다.</text>
<text x="58.13" y="593.94" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="63.25" lengthAdjust="spacing">2. 담당 업무</text>
<text x="74.63" y="607.69" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="452.1" lengthAdjust="spacing">신청인이 소속부서에서 담당하고 있는 업무를 기재합니다.(예 : 5급이하 임용, 계약관리 등)</text>
<text x="58.13" y="624.44" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="68.42" lengthAdjust="spacing">3. 이용사무명</text>
<text x="74.13" y="638.19" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="367.29" lengthAdjust="spacing">행정정보공동이용시스템에 등록되어 있는 정확한 사무 명칭을 기재합니다.</text>
<text x="58.13" y="654.94" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="155.65" lengthAdjust="spacing">4. 공동이용 행정정보(구비서류)</text>
<text x="74.63" y="668.69" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="378.29" lengthAdjust="spacing">해당 사무에 필요한 정보중 공동이용의 대상이 되는 행정정보를 기재합니다.</text>
<text x="58.13" y="685.44" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="36.41" lengthAdjust="spacing">5. 비고</text>
<text x="74.89" y="699.19" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="456.68" lengthAdjust="spacing">신청하는 사무를 일시적으로만 처리하기 위하여 신청하는 경우에는 그 기간, 그 외에 특기할</text>
<text x="74.57" y="712.94" font-size="11" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="266.09" lengthAdjust="spacing">사항이 있는 경우에는 그 사유 및 내용을 기재합니다.</text>
