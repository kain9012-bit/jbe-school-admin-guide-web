<text x="62.03" y="322.06" font-size="11" font-family="'한양중고딕','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="304.1" lengthAdjust="spacing">※ &lt;주의&gt; 공문 내용에 대상인원 성명, 주민등록번호 모두 기입</text>
<text x="56.69" y="339.66" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="151.3" lengthAdjust="spacing">3. 동의여부: (대상자 동의함 ■</text>
<text x="224" y="339.66" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="60.5" lengthAdjust="spacing">동의안함 □)</text>
<text x="56.69" y="357.26" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="208.07" lengthAdjust="spacing">4. 조회방법: 행정정보공동이용시스템 활용.</text>
<text x="275.43" y="357.26" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="13.76" lengthAdjust="spacing">끝.</text>
