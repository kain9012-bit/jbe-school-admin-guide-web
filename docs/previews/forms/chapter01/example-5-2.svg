<text x="107.37" y="391.36" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="359.82" lengthAdjust="spacingAndGlyphs">결격사유 및 범죄경력 유무 요청 시 대상자 명단이 다른 경우가 종종 발생</text>
