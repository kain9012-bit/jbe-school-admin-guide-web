<text x="105.94" y="244.92" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="315.36" lengthAdjust="spacing">○○○○○○ 채용을 위한 결격사유 및 범죄경력 유무조회</text>
<line x1="56.69" y1="254.33" x2="536.74" y2="254.32" stroke="#000000" stroke-width="0.91" />
<text x="56.69" y="266.29" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">2024년 ○○○○○○ 채용을 위한 관련 대상자의 결격사유 및 범죄경력 유무를 아래와 같이 </text>
<text x="56.69" y="283.89" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="94.38" lengthAdjust="spacing">조회하고자 합니다.</text>
<text x="56.69" y="301.49" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="154.61" lengthAdjust="spacing">근거법령: (예시) 0000법 제00조</text>
<text x="56.69" y="319.09" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="301" lengthAdjust="spacing">2. 대상인원: 김00(123456-1234567), 김00(654321-7654321) </text>
<text x="56.69" y="336.69" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="335.46" lengthAdjust="spacing"> ※ &lt;주의&gt; 공문 내용에 전체 대상인원 성명, 주민등록번호 모두 기입</text>
<text x="56.69" y="354.29" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="151.3" lengthAdjust="spacing">3. 동의여부: (대상자 동의함 ■</text>
<text x="224" y="354.29" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="60.5" lengthAdjust="spacing">동의안함 □)</text>
<text x="56.69" y="371.89" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="208.07" lengthAdjust="spacing">4. 조회방법: 행정정보공동이용시스템 활용.</text>
<text x="275.43" y="371.89" font-size="11" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="13.76" lengthAdjust="spacing">끝.</text>
<text x="228.71" y="413.63" font-size="10" font-family="'Malgun Gothic','맑은 고딕','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="137.8" lengthAdjust="spacing">[내부결재 문서 작성 주의사항]</text>
<text x="63.19" y="430.63" font-size="10" font-family="'Malgun Gothic','맑은 고딕','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="468.84" lengthAdjust="spacing">내부결재문서 등록 시 붙임파일(예: 전체대상자 명단 또는 사전동의서 등)을 첨부해야 할 경우 </text>
<text x="63.19" y="447.63" font-size="10" font-family="'Malgun Gothic','맑은 고딕','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="49.24" lengthAdjust="spacing">결재문서와</text>
<text x="112.43" y="447.63" font-size="10" font-family="'Malgun Gothic','맑은 고딕','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="419.6" lengthAdjust="spacing"> 붙임파일을 같이 스캔하여 하나의 파일로 만든 후 첨부하시기 바랍니다. (내부결재문서 </text>
