<text x="76.61" y="386.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="10.46" lengthAdjust="spacing">❍ </text>
<text x="87.06" y="386.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="451.51" lengthAdjust="spacing">정정의 권한은 학적부를 관리․보관하고 있는 학교장(기관장)에게 있으므로, 해당 학교장(기관장)의 판단 </text>
<text x="56.69" y="407.97" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="39.78" lengthAdjust="spacing">하에 정정</text>
<text x="77.28" y="429.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="461.29" lengthAdjust="spacing">❍ 행정정보공동이용시스템을 이용하여 학적부 정정 시 ‘학교생활기록부 작성·정정’권한을 활용하여 </text>
<text x="56.69" y="451.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="201.03" lengthAdjust="spacing">민원인의 등·초본 열람 가능(사전동의서 불필요)</text>
<text x="56.69" y="488.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="141.22" lengthAdjust="spacing" font-weight="bold">3. 학교생활기록부 정정 절차</text>
<text x="76.23" y="510.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="410.07" lengthAdjust="spacing">❍ 매 학년이 종료된 이후에는 당해 학년도 이전의 학교생활기록부 입력 자료에 대한 정정은 </text>
<text x="486.3" y="510.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="47.39" lengthAdjust="spacing" font-weight="bold" text-decoration="underline">원칙적으로</text>
<text x="56.69" y="531.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="18.23" lengthAdjust="spacing" font-weight="bold" text-decoration="underline">금지</text>
<text x="74.92" y="531.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="21.24" lengthAdjust="spacing">한다.</text>
<text x="76.3" y="553.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.27" lengthAdjust="spacing">❍ 정정이 불가피한 경우에는 반드시 정정내용에 관한 증빙자료를 첨부하여 정정의 사유, 정정내용 등에 </text>
<text x="56.69" y="574.97" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="481.88" lengthAdjust="spacing">대하여 학교 학업성적관리위원회의 심의 절차를 거친 후 학교생활기록부 정정대장의 결재 절차에 따라 </text>
<text x="56.69" y="596.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="381.2" lengthAdjust="spacing">재학생은 정정 사항의 발견 학년도 담임교사, 졸업생은 업무담당자가 정정 처리해야 한다.</text>
<text x="75.49" y="618.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="18.98" lengthAdjust="spacing">❍ 다</text>
<text x="94.47" y="618.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="249.88" lengthAdjust="spacing">만, 인적·학적사항의 학생정보는 학업성적관리위원회 심의를</text>
<text x="344.35" y="618.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="71.8" lengthAdjust="spacing"> 생략할 수 있다.</text>
<text x="56.69" y="650.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="136.13" lengthAdjust="spacing" font-weight="bold">4. 수기 학적부의 정정 요령</text>
<text x="76.28" y="672.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="10.28" lengthAdjust="spacing">❍ </text>
<text x="86.57" y="672.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="18.79" lengthAdjust="spacing">전산</text>
<text x="105.35" y="672.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="433.22" lengthAdjust="spacing">으로 관리되지 않은 졸업생의 수기 학교생활기록부 정정은 학교생활기록부 원본에 두 줄을 긋고 정정</text>
<text x="56.69" y="693.77" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="421.78" lengthAdjust="spacing">하여 학교장의 날인을 받으며, 관련 증빙서류는 수기 학교생활기록부 출력물 뒤에 첨부하여 보관한다.</text>
<text x="76.08" y="715.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif">※</text>
<text x="88.29" y="715.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="152.4" lengthAdjust="spacing">행정 효율과 협업 촉진에 관한 규정</text>
<text x="240.69" y="715.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="144.35" lengthAdjust="spacing"> 제17조(결재 받은 문서의 수정), </text>
<text x="385.04" y="715.37" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="153.53" lengthAdjust="spacing">행정 효율과 협업 촉진에 관한 규정 </text>
<text x="56.69" y="736.97" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="35.65" lengthAdjust="spacing">시행규칙</text>
<text x="92.34" y="736.97" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="168.31" lengthAdjust="spacing"> 제14조(결재 받은 문서의 수정 등) 참고</text>
<text x="76.06" y="758.57" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="462.51" lengthAdjust="spacing">❍ 이때 학교생활기록부 정정대장은 별도로 작성하여 학년도 말에 출력한 학교생활기록부 정정대장에 합철</text>
<text x="56.69" y="780.17" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="62.41" lengthAdjust="spacing">하여 보관한다.</text>
</g></g>
</svg>