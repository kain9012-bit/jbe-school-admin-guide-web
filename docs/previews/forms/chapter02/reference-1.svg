<text x="63.2" y="102.31" font-size="12" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="37.56" lengthAdjust="spacing">[참고1]</text>
<text x="234.43" y="145.8" font-size="20" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="126.4" lengthAdjust="spacing" font-weight="bold">학적부의 정정</text>
<text x="56.69" y="180" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="62.27" lengthAdjust="spacing" font-weight="bold">1. 정정 신청</text>
<text x="71.38" y="201.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="10.29" lengthAdjust="spacing">❍ </text>
<text x="81.67" y="201.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="452" lengthAdjust="spacing">본인의 학적부(학교생활기록부, 졸업대장 등) 내용에 오류/정정 사항이 있을 시 해당학교(폐교의 경우</text>
<text x="56.69" y="223.2" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="413.25" lengthAdjust="spacing">통합학교 및 교육청)를 직접 방문하여 신청하거나 가까운 교육청, 학교를 방문하여 팩스민원 신청</text>
<text x="56.69" y="255.6" font-size="12" font-family="'GulimChe','굴림체','Gulim','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="188.66" lengthAdjust="spacing" font-weight="bold">2. 학적부 정정신청에 필요한 증빙서류</text>
<text x="126.45" y="282.51" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" font-weight="bold">구</text>
<text x="144.57" y="282.51" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" font-weight="bold">분</text>
<text x="363.28" y="282.51" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" font-weight="bold">내</text>
<text x="386" y="282.51" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" font-weight="bold">용</text>
<text x="104.26" y="303.9" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="71.42" lengthAdjust="spacing">법원 판결에 의한 </text>
<text x="89.57" y="318.22" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="100.8" lengthAdjust="spacing">성명 및 주민번호 정정 시</text>
<text x="224.84" y="303.9" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="201.6" lengthAdjust="spacing">성명 및 주민번호 정정 이력을 확인할 수 있는 서류</text>
<text x="224.84" y="318.22" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="125.52" lengthAdjust="spacing">(주민등록표초본, 기본증명서 등)</text>
<text x="109.77" y="346.36" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="60.41" lengthAdjust="spacing">입력착오, 오기재</text>
<text x="224.84" y="339.2" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="125.87" lengthAdjust="spacing">정정내용을 증빙할 수 있는 서류</text>
<text x="224.84" y="353.52" font-size="11" font-family="'새굴림','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="231.58" lengthAdjust="spacing">(주민등록표초본, 기본증명서, 제적등본, 가족관계증명서 등)</text>
